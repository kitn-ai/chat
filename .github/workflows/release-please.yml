name: Release

# release-please watches Conventional Commits on main and maintains a "release
# PR" that bumps the version and updates CHANGELOG.md. Merging that PR creates
# the git tag + GitHub Release, and (in the same run) publishes to npm.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # The emergency hatch, and it is OFF by default on purpose. This trigger
      # exists to publish when release-please's own bookkeeping misses (see the
      # comment on the checkout step) -- that is a bug in the RELEASE plumbing,
      # not a reason to stop caring whether the code is green, so the manual path
      # is gated exactly like the automatic one. A human ticking this box for one
      # run is a decision somebody made; a gate that is off whenever a human is
      # involved is not a gate. `require-green-checks.mjs` re-checks the event
      # name itself before honouring it, so no push-triggered run can set it.
      skip_required_checks:
        description: 'EMERGENCY ONLY: publish without confirming the required checks passed on this commit'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) + provenance
  checks: read # publish gate: read the required check's conclusion on the SHA being published
  statuses: read # publish gate: the same question, for contexts reported via the statuses API

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Everything below runs when a release PR is merged (auto) OR when this
      # workflow is dispatched manually (workflow_dispatch). Use the manual
      # trigger to publish the current main version if the auto-gate ever
      # misses -- for example, after the release-please config path moved from
      # "." to "packages/ui", which caused release_created to evaluate false
      # even though the tag and GitHub release were created. Release PRs should
      # be merge-committed (not squashed) so release-please can read its own
      # commit back and set the output correctly.
      # `ref` is pinned to the SHA rather than left to default. On a push the two
      # are already the same, but on workflow_dispatch the default resolves the
      # BRANCH at checkout time while the publish gate below asks about
      # `github.sha` -- the head when the run was dispatched. Anything pushed in
      # between would mean vetting one tree and shipping another. Pinning makes
      # "the commit that was checked" and "the commit that is published" the same
      # object by construction.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created || steps.release.outputs.releases_created || github.event_name == 'workflow_dispatch' }}
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v4
        if: ${{ steps.release.outputs.release_created || steps.release.outputs.releases_created || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created || steps.release.outputs.releases_created || github.event_name == 'workflow_dispatch' }}
        with:
          # STAYS 22, deliberately, and MUST match the node-version in
          # .github/workflows/test.yml. That workflow typechecks, unit-tests and
          # builds on 22; this one builds the artifact that actually ships. Letting
          # them diverge means publishing a compiled package built on a Node major
          # nothing tests on, which is a worse exposure than the one below.
          #
          # The hazard here was `npm install -g npm@latest` on a floating node.
          # `node-version: 22` resolves to the newest 22.x (v22.23.2 today) while
          # npm 12.0.2 declares `engines.node: ^22.22.2 || ^24.15.0 || >=26.0.0` --
          # one minor of margin, and the margin is npm's to spend, since it raises
          # those floors to track node's security releases. A floor moving to
          # ^22.24.x before a 22.24.x existed would EBADENGINE the publish step at
          # publish time, on a tag already cut.
          #
          # The fix is the EXACT npm pin below, not a node bump: a pinned npm's
          # engines cannot move, so the drift is closed without touching the
          # toolchain the rest of CI is tested on. When node 22 goes EOL, bump this
          # and test.yml together as their own change.
          node-version: 22
          registry-url: https://registry.npmjs.org

      # THE PUBLISH GATE. Nothing below this line may run unless the commit being
      # published passed the checks this repository requires.
      #
      # Until this step existed, the publish was UNGATED. This workflow and
      # test.yml are separate workflows on the same `push: main` trigger, so they
      # race, and the publish wins: on af6f7717 the `release` workflow finished at
      # 01:30:57 and `test` did not conclude until 01:39:48. On 12a51dad the same
      # race resolved the other way -- `release` completed at 01:56:58 and `test`
      # FAILED at 02:04:17. Four releases shipped on that basis.
      #
      # Why this and not the obvious alternatives:
      #   - `needs:` relates jobs within ONE workflow. `test` lives in test.yml,
      #     so there is no job here to depend on.
      #   - "was the release PR green" does not exist. release-please opens its PR
      #     with GITHUB_TOKEN, so the PR's workflow runs sit in `action_required`
      #     and never execute; commit 4b276894 (a release-branch head) carries
      #     ZERO check runs.
      #   - `workflow_run` off test.yml would cover the push path only, leaving
      #     workflow_dispatch to grow a second mechanism, and it splits one linear
      #     release run into two -- in a pipeline whose recent failures were a
      #     failed publish and an orphaned release PR, that is the wrong trade.
      #
      # So the question is asked about the COMMIT, at publish time, against the
      # API, scoped to `github.sha` and nothing else. "A recent green run" would be
      # the same illusion as no gate.
      #
      # It WAITS rather than demanding an immediate answer, because at this moment
      # `test` is normally still running -- refusing on `in_progress` would block
      # every legitimate release. It refuses immediately on a terminal failure,
      # and it refuses on the timeout, on an absent context, and on an API it
      # cannot read. Deny by default: only an observed `success` on this SHA opens
      # the gate.
      #
      # The `if:` is byte-identical to the publish step's, deliberately -- that is
      # what makes the gate applicable in exactly the cases a publish is, and
      # tests/scripts/publish-gate-wiring.test.ts fails if the two ever drift.
      # Runs before `pnpm install` so a refusal costs seconds, not a full build.
      #
      # `--require` must name the contexts branch protection requires. That list
      # is ruleset config, not workflow config, so this file cannot be
      # authoritative about it; print the live list with:
      #
      #   gh api repos/kitn-ai/ui/rulesets/18328421 \
      #     --jq '.rules[] | select(.type == "required_status_checks")
      #           | .parameters.required_status_checks[].context'
      #
      # (GITHUB_TOKEN cannot read rulesets -- that needs Administration:read,
      # which the workflow `permissions:` block has no key for -- so this cannot
      # be derived at runtime. If the ruleset gains a context, add it here. Naming
      # a context that does not exist makes the gate refuse everything, which is
      # loud and safe; the reverse would be silent.)
      #
      # As of 2026-09-01, ruleset 18328421 requires TWO contexts: `test` and
      # `storybook-gate`. Both are listed below (one `--require` per context, or
      # comma-separate them in a single flag -- the script accepts either). Before
      # this, `storybook-gate` was enforced on PRs but not checked here, so a red
      # `storybook-gate` on the commit being released would not have blocked the
      # publish. See docs/coupling-map.md row 7 for how this list is kept in sync
      # with the ruleset: hand-typed, not derived, and unguarded if it drifts.
      - name: Publish gate — require green checks on the commit being published
        if: ${{ steps.release.outputs.release_created || steps.release.outputs.releases_created || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/require-green-checks.mjs \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --require test \
            --require storybook-gate \
            --timeout-minutes 45 \
            --event-name "${{ github.event_name }}" \
            --override "${{ inputs.skip_required_checks }}"

      - run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created || steps.release.outputs.releases_created || github.event_name == 'workflow_dispatch' }}

      # OIDC trusted publishing needs npm >= 11.5.1, and Node 22 bundles 10.9.8, so
      # this line is load-bearing: without it the publish goes out unauthenticated
      # and gets E404. EXACT, not @latest -- see the node-version comment above; the
      # pin is what stops a future npm engine bump breaking this job mid-release.
      # Verified on node 22: npm@12.0.2 installs, reports 12.0.2 and reaches the
      # registry. Bump it deliberately, in step with node-version.
      - run: npm install -g npm@12.0.2
        if: ${{ steps.release.outputs.release_created || steps.release.outputs.releases_created || github.event_name == 'workflow_dispatch' }}

      # Publish with the npm CLI (NOT pnpm publish -- pnpm does not do npm's OIDC
      # token exchange, so it publishes unauthenticated and gets E404). Run from the
      # package dir; prepublishOnly runs the build. No NODE_AUTH_TOKEN; provenance
      # is automatic with OIDC for a public package.
      # ORDER IS LOAD-BEARING: packages/ui publishes FIRST. create-kai's build pins
      # `^<the kit's version>` into every project it emits, so publishing it ahead of
      # the kit would ship a scaffold whose own dependency is not on the registry
      # yet -- `npm install` in the user's brand new project fails. The loop runs
      # under `bash -e`, so if the kit fails to publish the step aborts and
      # create-kai is never reached, which is what keeps that ordering true rather
      # than merely intended.
      #
      # THAT ORDERING ONLY MATTERS IF create-kai IS IN THE RELEASE AT ALL, and for
      # a long time it usually was not. The two packages release independently, so
      # a kit-only release left the PUBLISHED create-kai pinning `^<previous kit>`
      # — and a caret cannot cross a minor pre-1.0, so that pin could never reach
      # the new kit. create-kai@0.1.2 sat on `^0.24.0` after 0.24.0 was deprecated
      # for a critical XSS: `npm create kai@latest` scaffolded a vulnerable project
      # with no upgrade path inside its own range. Nothing was broken in the tree;
      # the artefact on the registry had simply decayed.
      #
      # `"plugins": ["node-workspace"]` in release-please-config.json is what
      # closes it. The plugin walks the workspace graph and patch-bumps any
      # configured package that DEPENDS on one being released — create-kai's
      # `"@kitn.ai/ui": "workspace:*"` devDependency is that edge. It counts
      # devDependencies unconditionally (only peerDependencies are opt-in), and it
      # bumps on the graph edge rather than on having a range to rewrite, so the
      # unrewritable `workspace:*` still triggers the release. So every kit release
      # now drags a create-kai release behind it, and this loop rebuilds the pin.
      #
      # The plugin guarantees a release HAPPENS; it does not guarantee the pin in
      # the artefact is right. That is a separate property with its own guard:
      # `verify:pack` (offline, in create-kai's prepublishOnly) refuses to publish
      # a bundle whose pin disagrees with the kit beside it, and `verify:pin`
      # (network, run manually) checks the published pin against the registry.
      - name: Publish to npm (OIDC trusted publishing)
        # Idempotent publish, PER PACKAGE. release-please re-emits releases_created
        # for the LAST release on a plain push to main (the first non-release push
        # after a release), which would otherwise hard-fail this step with "cannot
        # publish over <version>". Skip when this exact name@version is already on
        # the registry so the run stays green; a genuinely new version (real release
        # or workflow_dispatch) is not yet on npm, so it still publishes. Also
        # absorbs the benign E403-after-success republish retry.
        #
        # The guard stays per-package and stays an existence check. Do NOT swap it
        # for release-please's per-path `release_created` outputs: that output
        # over-firing on a plain push is the exact thing this absorbs, so keying on
        # it would reintroduce the failure the guard was written for. With two
        # packages the over-fire also gets worse -- a re-emit names whichever
        # package released last, and the other one must still be skipped rather than
        # attempted.
        #
        # npm, never `pnpm publish`: pnpm does not do npm's OIDC token exchange, so
        # it publishes unauthenticated and gets E404. Each publish runs INSIDE its
        # own package dir so that package's own prepublishOnly fires -- that hook is
        # what builds the thing being shipped, and for create-kai it is the only
        # thing standing between a fresh checkout and a tarball with no CLI in it.
        # No NODE_AUTH_TOKEN; provenance is automatic with OIDC for a public package.
        run: |
          for pkg in packages/ui packages/create-kai; do
            NAME=$(node -p "require('./$pkg/package.json').name")
            VERSION=$(node -p "require('./$pkg/package.json').version")
            if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
              echo "$NAME@$VERSION is already published — skipping publish."
              continue
            fi
            echo "Publishing $NAME@$VERSION from $pkg..."
            (cd "$pkg" && npm publish --access public)
          done
        if: ${{ steps.release.outputs.release_created || steps.release.outputs.releases_created || github.event_name == 'workflow_dispatch' }}
