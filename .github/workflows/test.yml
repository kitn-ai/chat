name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # THE REQUIRED CHECK IS A GRAPH, NOT A JOB.
  #
  # `test` is an aggregator. It runs no gate itself: five legs do, in parallel,
  # and `test` fails unless every one of them succeeded. The check-run name stays
  # `test` because that is the context the ruleset requires and the literal
  # `require-green-checks.mjs` gates the publish on, and moving it would buy
  # nothing while touching two lists that nothing derives.
  #
  # `if: always()` on the aggregator is not optional. Without it a failed leg
  # SKIPS the aggregator, and a skipped required check is not a red one -- that is
  # a green gate over a workflow that ran nothing.
  #
  # The verdict is derived from `toJSON(needs)` rather than a hand-written `if`
  # chain, so a leg added to `needs:` and forgotten in the verdict cannot go
  # ungated. `toJSON(needs)` IS the `needs:` list; the two cannot drift.
  #
  # `pnpm --filter @kitn.ai/ui run lint:gate-parity` reads the same graph: the
  # gate set is `test` union its transitive `needs:`, and a job in this workflow
  # that carries a gate and is NOT reachable from `test` is a hard failure there.
  # So a step moved out of the graph is as loud as a step deleted.
  #
  # The storybook browser project runs in its own `storybook` matrix, aggregated
  # by `storybook-gate`, which is ALSO a required context as of 2026-09-01.
  #
  # WHICH CONTEXTS BLOCK A MERGE IS RULESET CONFIG, NOT WORKFLOW CONFIG, so this
  # comment cannot be authoritative and you should not act on it without asking
  # the API. Job names here do not imply required status; only the ruleset does:
  #
  #   gh api repos/kitn-ai/ui/rulesets/18328421 \
  #     --jq '.rules[] | select(.type == "required_status_checks")
  #           | .parameters.required_status_checks[].context'
  #
  # That prints the live list. If it prints anything other than `test` and
  # `storybook-gate`, this comment and the `storybook-gate` one below are the
  # stale things.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No workflow in this repository may spend money on model calls.
      #
      # The openrouter spike's conformance harness can drive REAL models through
      # OpenRouter; a measured five-configuration sweep came to $0.1019. Live
      # runs are manual and deliberate, and this is the step that keeps them
      # that way for every workflow file in the repo, not just the one below.
      #
      # It exists because the interesting failure is in the FUTURE: someone
      # copies the advisory conformance job in spike-conformance.yml, flips it
      # to live for a nightly sweep, and nothing objects. The audit's central
      # rule is deny-by-default -- any line that reaches the harness without
      # going through `spike-ci-guard.mjs exec` is a finding, so an invocation
      # route nobody predicted fails BECAUSE it is unrecognised rather than
      # passing because it is unlisted.
      #
      # It cannot pass vacuously: a self-test runs each of the 6 rules against
      # its own known-bad sample and the whole rule set against a known-good
      # one FIRST, and hard-fails the run if a rule that must fire does not, or
      # if the clean sample draws a finding. Watched failing rather than assumed
      # to: neutering one rule's pattern turns it red naming that rule.
      #
      # Deliberately before `pnpm install` -- pure node, no dependencies, no
      # build, no network. <1s.
      - name: Model-spend guard (no workflow can reach a live model)
        run: node .github/scripts/spike-ci-guard.mjs audit

      # examples/starters/tanstack-start is deliberately NOT a pnpm workspace
      # member (see pnpm-workspace.yaml): it carries `.npmrc` with
      # install-links=true so it reproduces a real npm-install consumer path,
      # which is the entire reason the starter exists. The cost of that is that
      # it has no nx `test` target and packages/ui's vitest root cannot see it,
      # so its 43-test static-file-server suite -- the one that pins the
      # path-traversal guard in serve.mjs, including the block proving the suite
      # can fail -- ran in NO CI at all. A test nobody runs is not a test.
      #
      # It goes HERE, in the required job, ahead of `pnpm install`, because it
      # needs neither an install nor a build: node's built-in runner, its own
      # synthesised fixture tree, no dependencies. ~2s, and a break fails the run
      # before 20 minutes of build have been spent. This is REQUIRED signal --
      # `test` is the context branch protection requires -- not advisory.
      #
      # node's own exit code is this step's exit code: no pipe, no `tail`, no
      # wrapper shell that could swallow it.
      - name: TanStack Start static-server guard (path traversal, no install needed)
        working-directory: examples/starters/tanstack-start
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/tanstack-traversal.tap"

      # The step above cannot be trusted on its exit code alone. MEASURED on node
      # 22.22: `node --test` in a directory it matches no files in prints
      # "# tests 0" and exits 0 -- "zero tests found" and "all 43 passed" are the
      # same outcome. So a wrong working-directory, a renamed suite, or a change
      # to node's discovery glob would turn this into a green step covering
      # nothing, which is the precise failure mode the suite was written against.
      #
      # Hence the second TAP reporter above, written to a file, and this: the run
      # must REPORT a non-zero test count. An empty run fails here, loudly,
      # naming what it saw.
      - name: Traversal guard ran a non-empty suite (0 tests must not read as green)
        run: |
          node -e '
            const fs = require("node:fs");
            const tap = process.env.RUNNER_TEMP + "/tanstack-traversal.tap";
            const m = /^# tests (\d+)$/m.exec(fs.readFileSync(tap, "utf8"));
            if (!m) {
              console.error(`no "# tests" line in ${tap}: the run above emitted no TAP plan at all`);
              process.exit(1);
            }
            if (Number(m[1]) < 1) {
              console.error(`the traversal suite reported ${m[1]} tests. It exited 0 because node --test treats "matched no files" as success -- check the working-directory and the suite filename.`);
              process.exit(1);
            }
            console.log(`traversal suite reported ${m[1]} tests`);
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CLAUDE.md's "decide loudly" corollary, enforced on the one layer where a
      # quiet decision is IRREVERSIBLE: src/wire turns ChatMessage.parts into a
      # provider request, so a variant it does not encode is gone by the time the
      # request leaves the process. #186 shipped exactly that -- a user turn
      # carrying only an attachment encoded to nothing -- and the drop was already
      # explained in a prose comment, which is why the waiver this guard accepts
      # is a parsed directive that must NAME each dropped variant rather than a
      # sentence. A waiver covers only what it spells out, so a seventh
      # MessagePart member re-fires every waived site instead of being swallowed.
      #
      # Runs BEFORE the build because it needs none: it parses source only and
      # reads no dist/, so it reports in ~1s and is a seam anyone can grab to
      # watch it fail (`node packages/ui/scripts/lint-silent-drops.mjs`).
      #
      # It cannot pass vacuously. `--self-test` asserts the analyzer still
      # DETECTS on ten known-bad and known-good inputs, and the scan itself exits
      # non-zero if the MessagePart union will not parse, if no wire source is
      # found, or if no function in it discriminates a part at all -- because each
      # of those is this script being broken, not the tree being clean.
      - name: Silent-drop guard (wire encoders)
        run: pnpm --filter @kitn.ai/ui run lint:silent-drops

      # Every authored catalog claim (element tags, events, properties, invariant
      # ids, corpus paths, inventory titles, scenario invariant refs) must resolve
      # against the derived layer and the tree. This is what stops the authored
      # surface layer becoming prose about a tree that moved underneath it.
      # Self-test first: a checker that cannot detect is a green lie. Needs no
      # build -- it reads derived.json and bundles the catalog with esbuild.
      - name: Catalog drift guard (authored claims resolve)
        run: pnpm --filter @kitn.ai/ui run lint:catalog-drift

      # Reintroduction guard for `url: URL.createObjectURL(file)` -- an object
      # URL staged onto an attachment's `url`, the field the wire has to encode.
      # It resolves only inside the tab that minted it, so it renders a perfect
      # thumbnail and reaches no model; #186 shipped exactly that. The encoders
      # now REFUSE it, so this guards the SOURCE rather than the symptom, and it
      # fixes the two instances that were live on ui.kitn.ai -- one of which
      # recommended the anti-pattern in a comment.
      #
      # UNLIKE the silent-drop guard directly above, a ZERO-MATCH RUN HERE IS A
      # PASS. That one scans for dispatch sites it knows exist, so finding none
      # means it is broken; this one scans for a forbidden pattern, so finding
      # none is the healthy steady state and is the state the tree is in the
      # moment it lands. Its vacuity tripwire is therefore zero FILES walked, not
      # zero findings, plus a --self-test that asserts the analyzer still detects
      # on 18 known-bad and known-good inputs.
      #
      # Detection is structural, on a real TS parse: a `url` property (or `.url`
      # member) whose value comes from createObjectURL. It deliberately does NOT
      # key on the `cond ? work() : undefined` ternary shape, which lint-silent-
      # drops records as considered and rejected for imprecision. Minting an
      # object URL to render bytes IN-TAB (components/image.tsx, voice-output.tsx)
      # binds a variable rather than a `url` property and is never matched.
      #
      # Parses source, reads no dist/, so it is a seam anyone can grab to watch it
      # fail (`node packages/ui/scripts/lint-attachment-object-urls.mjs`).
      - name: Attachment object-URL guard (docs, stories, kit)
        run: pnpm --filter @kitn.ai/ui run lint:attachment-object-urls

      # Staleness guard for hand-typed CDN version pins. The docs correctly tell
      # people to pin an exact version for CDN use, but every pin was a literal
      # somebody typed once while the kit kept releasing. When a Critical
      # advisory landed against 0.14.1-0.24.0, four copy-pasteable URLs across
      # the docs and the npm README were still serving 0.20.1 and 0.16.0.
      #
      # The npm README is the one that matters most: npm prints a deprecation
      # warning on `npm install`, and all 17 affected versions are deprecated,
      # but A CDN FETCH PRINTS NOTHING. The channel with no safety net carried
      # the stalest pin, on the page a prospective user sees first.
      #
      # It asserts EQUALITY with packages/ui/package.json, not range membership.
      # A range check would be a check that cannot fail -- `^0.25.0` always
      # contains 0.25.0 -- so it would go green forever while the docs rotted.
      # These two sides are independent (prose a human typed vs. the manifest
      # release-please rewrites) and drift apart on every single release.
      #
      # Like lint-silent-drops and UNLIKE the object-URL guard above, a
      # ZERO-MATCH RUN IS A FAILURE: this scans for pins the docs deliberately
      # recommend and therefore knows exist, so finding none means the walk broke
      # -- which would pass every stale pin in the tree forever.
      #
      # Lines narrating real past releases carry `lint-cdn-pins: historical --
      # <reason>`, a parsed directive rather than prose, so a record is waived
      # instead of being rewritten into a falsehood.
      #
      # Reads source and package.json only, no dist/, so it is a seam anyone can
      # grab to watch it fail (`node packages/ui/scripts/lint-cdn-pins.mjs`).
      # `--fix` rewrites every stale pin when the version bumps.
      - name: CDN version-pin staleness guard (docs, README, examples)
        run: pnpm --filter @kitn.ai/ui run lint:cdn-pins

      # Size budget for the committed llms-full.txt. The file is generated, so
      # it grows as a SIDE EFFECT of unrelated work -- a new element, a fatter
      # doc comment, a new generated section -- and nothing else prices that
      # growth. Both costs it guards degrade quietly with the byte count: grep
      # precision (more near-duplicate rows per query) and whole-file ingestion
      # cost for agents that read it wholesale. The ceiling makes growth a
      # conscious act: raise it only with a dated note on what grew and why, in
      # the style of verify-pack-weight.mjs.
      #
      # It cannot pass vacuously: a MISSING artifact is a hard failure, and a
      # floor catches the truncation this repo already shipped once (gen-llms
      # run standalone silently rewrote the file with LESS data; the oversized
      # diff was the only tell). `--self-test` runs the real verdict + stat path
      # against on-disk fixtures on every invocation.
      #
      # Reads the committed artifact only, no dist/, so it is a seam anyone can
      # grab to watch it fail (`node packages/ui/scripts/lint-llms-size.mjs`).
      - name: llms-full.txt size budget
        run: pnpm --filter @kitn.ai/ui run lint:llms-size

      # Every script reading `npm pack --json` must go through the one parser
      # that knows both container shapes. npm 12 made the top level an object
      # keyed by package name; `JSON.parse(raw)[0]` is `undefined` under it, and
      # that took down a release mid-publish. #241 fixed create-kai's site and
      # wrote the shared parser -- and left three more hand-rolled copies in
      # packages/ui/scripts, because nothing related the four sites to each other.
      #
      # This is the half that fires when the defect is WRITTEN. The end-to-end
      # half (running the guards under the npm the release pins) is further down
      # in this job and only covers the two `verify:pack` scripts; a fifth reader
      # added next month is caught here or nowhere. Source-only, no build, ~1s.
      - name: pack --json parse guard (one parser, both npm shapes)
        run: pnpm --filter @kitn.ai/ui run lint:pack-parse

      # Two story-convention defects were hand-authored per `.stories.tsx` file
      # with nothing enforcing them: (a) a story that draws its own JSX via
      # `render:` has no auto-derived Controls/Code panel to fall back on, so
      # the house convention is a hand-authored `docs.source.code` usage
      # snippet -- `view-stack.stories.tsx` and `pane-group.stories.tsx`
      # shipped `render:` stories with neither, so their Code tab silently
      # showed Storybook's raw serialized story-object dump instead of usage
      # code; (b) an `argTypes` entry whose key looks like an event
      # (`/^on[A-Z]/`) needs `table: { category: 'Events' }` to sort into the
      # Events group rather than alongside plain props -- ~34 files defined an
      # `onX` argType without it.
      #
      # A real TS parse, not a regex: both rules are about a SHAPE in the code
      # (a property chain, a story's `render` key), the same reasoning
      # lint-cdn-pins gives for why IT stays regex on a token that also
      # legitimately appears in prose -- this is the opposite case.
      #
      # `--self-test` proves the analyzer still detects both defect shapes (and
      # correctly exempts the shared `const meta = {...}.render` args-driven
      # wrapper, and spread `...argTypesFor(...)` entries, which carry no
      # static key to check) before trusting the real scan. A run that matches
      # no `.stories.tsx` file at all is a hard failure, not a clean tree.
      #
      # Reads source only, no dist/, so it is a seam anyone can grab to watch
      # it fail (`node packages/ui/scripts/lint-story-conventions.mjs`).
      - name: Story-convention guard (docs.source.code + argType Events category)
        run: pnpm --filter @kitn.ai/ui run lint:story-conventions

      # Does a document that ENUMERATES the merge gate still match this job?
      # A handoff said "every gate is green" over a five-command list while this
      # job was red on `verify:pack`, which was not one of the five --
      # derived.json had grown past that check's per-file ceiling and was
      # shipping to every consumer. A list somebody typed once is not the job.
      #
      # The source of truth is the steps BELOW AND ABOVE THIS ONE: the guard
      # parses this file, scopes to the `test` job, and canonicalizes every
      # step's command to a stable identifier by RULE -- there is no hand-typed
      # list of the steps anywhere in it, so adding a step of a known shape needs
      # no edit there, and an UNRECOGNISED shape is a hard failure naming the
      # step rather than a silent omission from the gate set.
      #
      # The doc side is a parsed directive and not prose, for the reason
      # lint-silent-drops gives and which is not hypothetical here: the document
      # this guard is built from already carried a paragraph saying its list was
      # incomplete, so a rule honouring prose would have passed the exact text
      # that was wrong. A block marked `gate-list: complete` must equal this
      # job's gate set both directions; one labelled `partial` is skipped; and an
      # UNMARKED block that looks like a gate list is a hard failure until
      # somebody chooses. That last rule is the teeth -- the historical failure
      # was an unmarked partial list read as complete, and only forcing the
      # choice catches it.
      #
      # It cannot pass vacuously: it refuses to run at all if the extractor finds
      # implausibly few steps, because a near-empty gate set is a set every
      # documented list matches. `--self-test` plants each fault (a complete
      # block missing a gate, one carrying a non-gate, an unmarked suspect, an
      # unrecognised step shape) and watches it fire first.
      #
      # Parses this file and markdown, reads no dist/, needs no install, so it is
      # a seam anyone can grab to watch it fail
      # (`node packages/ui/scripts/lint-gate-parity.mjs`; `--list` prints the
      # gate set). ~1s.
      - name: Documented-gate parity guard (a doc gate list equals this job)
        run: pnpm --filter @kitn.ai/ui run lint:gate-parity

      # A numeric threshold with no derivation is a guess wearing a number, and
      # everything downstream treats it as a measurement. A `< 6000` byte budget
      # was invented while a plan was being drafted, survived into an
      # implementer's brief, and was stopped only because that implementer
      # declined to weaken an assertion to meet it. Nothing produced the number;
      # it read like evidence because it had a digit in it.
      #
      # So a threshold line in a NEW plan or spec must name where its number
      # comes from: a backticked producing command, the phrase `ratchet, not a
      # target`, or a written waiver. Any of the three; none of them is not.
      # Scope is DERIVED from the `YYYY-MM-DD-` filename prefix against a cutoff,
      # so the historical plans stay a record rather than a backlog -- rewriting
      # them to satisfy a linter is the failure mode lint-cdn-pins documents.
      #
      # UNLIKE lint-cdn-pins and LIKE the object-URL guard, AN EMPTY SCOPE IS A
      # PASS, and it is loud about it: the run prints the file count and the
      # cutoff, so "0 findings" can never be read as "the plans were checked". On
      # the day this landed the scope is empty by construction. What stops that
      # being vacuous is `--self-test`, which asserts the analyzer still detects
      # on known-bad and known-good lines and still scopes correctly; a MISSING
      # plans/ or specs/ directory, and a file in them this cannot date, are both
      # hard failures rather than silent skips.
      #
      # Reads markdown only -- no install, no build, no network. <1s
      # (`node packages/ui/scripts/lint-threshold-derivation.mjs`).
      - name: Threshold derivation guard (no number without a producer)
        run: pnpm --filter @kitn.ai/ui run lint:thresholds

      # Coverage guard over the CLIENT-side card validator. Every keyword, at every
      # keyword position, in every card schema must land in exactly one of three
      # tables: ENFORCED, STRIPPED (annotation/meta, so dropping it is lossless), or
      # NOT_ENFORCED (a real constraint this validator does not implement, named
      # with a written reason). Anything else is a hard failure naming the keyword,
      # the file and the path.
      #
      # The hazard is a keyword sitting in a schema LOOKING like it constrains the
      # model's output while constraining nothing: the kit then claims to validate
      # something it does not, and a malformed card renders anyway. A silent skip
      # list would defeat the whole point, which is why the unenforced set must be
      # written down and justified rather than inferred.
      #
      # The ENFORCED set is read out of the BODY of validateAgainstSchema, not out
      # of the JsonSchema interface, because the interface is a declaration and
      # drifts in the one direction that matters -- adding `multipleOf?: number` to
      # it without adding a check to walk() would make a list-based guard call that
      # keyword enforced while nothing enforced it.
      #
      # Same script as the `build:card-validation` generator, run with --check: it
      # writes nothing and fails on drift, so the checked-in lean projection cannot
      # silently diverge from the authored schemas. Source-level -- needs neither
      # the build nor network. ~0.3s.
      - name: Card-validation coverage guard (no keyword validates nothing)
        run: pnpm --filter @kitn.ai/ui run verify:card-validation

      # The pre-build half of the artifact-coverage check below. Everything
      # gitignored that exists NOW is the install and whatever caches the runner
      # carries; anything gitignored that appears after `nx build ui` is build
      # output, and the artifact has to carry it or the downstream legs simply do
      # not have it. Asserts nothing on its own -- the step that reads it does.
      - name: Ignored-path snapshot (what is on disk before the build writes)
        run: git status --porcelain --ignored=matching packages/ui > "$RUNNER_TEMP/ignored-before.txt"

      - name: Build (element bundle + provider subpath)
        run: pnpm exec nx build ui

      # THE ARTIFACT GLOB IS THE NEW `outputs:` LIST, and it has the nx list's
      # failure mode with none of its mitigations: a downstream leg never runs
      # `postbuild`, so a build-written path the glob omits is silently ABSENT
      # there rather than stale, and it surfaces as an unrelated-looking failure
      # three jobs later. coupling-map's `nx.json build.outputs` row called that
      # hazard local-only; this split makes it live, and this closes it.
      #
      # It diffs the gitignored paths under packages/ui across the build and
      # fails on anything uncovered that is not a named runtime cache, reading
      # the glob out of the upload step below rather than restating it. ~1s.
      - name: Artifact glob covers everything the build wrote
        run: ARTIFACT_GLOB_BEFORE="$RUNNER_TEMP/ignored-before.txt" pnpm --filter @kitn.ai/ui run verify:artifact-glob

      # ONE artifact, four consumers. The three paths are the complete
      # gitignored-and-build-written set under packages/ui: dist/, the
      # `build:css` prebuild output, and the block driver pages `build:blocks`
      # generates for `verify:blocks`. Everything else the build writes --
      # element-meta.json, derived.json, llms-full.txt, the React wrappers,
      # docs/web-components.md, the construct template fixtures -- is COMMITTED,
      # so a downstream `checkout` already has it, and `verify:generated` in
      # `dist-guards` proves it is the right version.
      #
      # actions/upload-artifact roots the artifact at the least common ancestor
      # of these paths, which is `packages/ui`. That is why every download below
      # says `path: packages/ui`, and why the guard above refuses a glob outside
      # that directory: one would move the root and land every download's files
      # somewhere else.
      #
      # `if-no-files-found: error` is what holds that premise up, and the default
      # is `warn`. The root is the LCA of the files actually MATCHED, not of the
      # globs declared: if compiled.css and the block-driver pages are both
      # missing, the root collapses to `packages/ui/dist` and every `path:
      # packages/ui` download below unpacks dist's CONTENTS straight into
      # packages/ui/, with no error anywhere. verify:artifact-glob cannot see
      # this -- it asks whether the globs cover what the build wrote, not whether
      # the upload matched anything.
      - name: Upload the kit build for the downstream legs
        uses: actions/upload-artifact@v4
        with:
          name: kit-dist
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
          path: |
            packages/ui/dist/**
            packages/ui/src/elements/compiled.css
            packages/ui/scripts/block-driver/pages/generated/**

  # 30% of the whole gate, sharing nothing with anything else, so it gets its own
  # leg. `verify-construct.mjs` ejects against THIS CHECKOUT'S OWN packed tarball
  # and then runs a real `npm install` per cell, which is where the time goes.
  #
  # NO PATH FILTER, deliberately. A PR touching only src/elements/ changes what
  # every cell installs while matching nothing a construct-scoped filter would
  # look at -- "the tree is not the tarball, and the tarball is not what npx
  # runs", in its most literal form. A filter safe enough to use would have to
  # fire on packages/ui/** plus scripts/** plus the lockfile plus this file,
  # which is nearly every PR: it would buy almost nothing and add a way to be
  # wrong.
  construct:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the kit build
        uses: actions/download-artifact@v4
        with:
          name: kit-dist
          path: packages/ui

      # `actions/upload-artifact` does not preserve mtimes: every file in the
      # tarball is stamped at EXTRACTION time, in the order the zip holds them.
      # `dist/**` comes out before `src/elements/compiled.css`, so the source ends
      # up looking NEWER than the bundle built from it -- and the mtime-based
      # stale-bundle guard in tests/e2e/hover-card-global-setup.ts reads exactly
      # that shape as "you edited src and forgot to rebuild" and refuses to run.
      # It fired on the browser leg the first time this split ran, over a bundle
      # that was seconds old.
      #
      # The ordering the guard checks is REAL here -- `needs: build` means this
      # artifact is this commit's build -- so restore the ordering the artifact
      # hop destroyed rather than weakening the guard, which is the only thing
      # standing between a local run and a pass measured on stale code. Every leg
      # that downloads the build gets this, not just the one with the guard
      # today: the breakage belongs to the download, not to the guard.
      - name: Restore the build's mtimes (upload-artifact does not preserve them)
        run: find packages/ui/dist -exec touch {} +

      # BEFORE the emit chain, not after it. This cache used to sit nine steps
      # downstream of the chain that does the npm install, so the shared install
      # ran fully cold on every single run and the cache warmed nothing.
      #
      # Its own key, over what actually determines the emitted projects'
      # dependency set: the construct schema, the template registry, and
      # packages/ui/package.json (whose version goes into every emitted pin). A
      # separate key from the starters cache in `dist-guards` is what keeps two
      # legs sharing ~/.npm from racing on one entry.
      - name: Cache npm (construct emit chain)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: construct-npm-${{ hashFiles('packages/ui/src/agent-tooling/construct/construct.v1.schema.json', 'packages/ui/src/agent-tooling/construct/templates.ts', 'packages/ui/package.json') }}
          restore-keys: construct-npm-

      # The construct engine's real emit chain: node bin/mcp.js eject (the CLI,
      # not the library) -> a real npm install -> tsc --noEmit under the cell's
      # OWN emitted tsconfig -> npm run build -> for one cell per layout, a real
      # Vite 8 consumer bundle asserting the registration survives. Axes (layout,
      # capability) are derived from the drift-guarded construct.v1.schema.json
      # artifact, never typed here -- the script prints what it actually ran.
      # --self-test runs first and proves the harness detects a spliced type
      # error and a hand-stripped registration before the real cells are trusted.
      - name: Construct engine emit chain (real eject + install + tsc + build + consumer bundle)
        run: pnpm --filter @kitn.ai/ui run verify:construct

  # The jsdom suite and everything that hangs off create-kai's build. `unit` and
  # `emitted` stay adjacent because they are one argument split across two vitest
  # projects, and `create-kai build` sits next to the two verify:pack steps that
  # read what it produced.
  unit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the kit build
        uses: actions/download-artifact@v4
        with:
          name: kit-dist
          path: packages/ui

      # Restores the mtime ordering the artifact hop destroys -- see the comment
      # on this step in the `construct` leg.
      - name: Restore the build's mtimes (upload-artifact does not preserve them)
        run: find packages/ui/dist -exec touch {} +

      # Run ONLY the jsdom unit project. pnpm test (= vitest run) would also
      # spin up the storybook BROWSER project; that runs in its own job now.
      - name: Unit tests (jsdom)
        run: pnpm --filter @kitn.ai/ui exec vitest run --project=unit

      # The run-the-emitted-code guards, in the REQUIRED job on purpose.
      #
      # They write the `kai` MCP scaffolder's emitted `src/main.ts` to a real module
      # and EXECUTE it against a mounted <kai-chat> and a stubbed provider stream, so
      # they are the only layer that can tell a working emit from a plausible-looking
      # one -- scaffold.test.ts asserts the wording of string literals and
      # verify:scaffold compiles the output under eight consumer tsconfigs, and
      # neither can see whether anything reaches the screen.
      #
      # A SEPARATE STEP, NOT A SEPARATE JOB. The whole reason these moved out of the
      # `unit` project is that they cost seconds each (recorded as 9.6s idle, 32.6s
      # under CPU starvation -- BOTH INVALIDATED: the "idle" box had four cores pinned
      # by orphaned CPU burners, see `packages/ui/emitted-code-tests.ts`. The ORDER of
      # magnitude is what this argument rests on, and seconds-not-milliseconds
      # survives; the specific figures do not) and were distorting a suite whose
      # 99th-percentile test is under a second. That is an argument about which
      # project owns them, not about whether
      # they gate a merge: they must stay inside the one required context, next to the
      # build they depend on, or splitting them out would have traded a slow check for
      # no check. Needs the build above (src/elements/compiled.css). ~10s, which
      # restates the same invalidated local "idle" reading and is not a figure from
      # this runner; treat it as an order of magnitude, not a budget.
      # (The required context is now the `test` GRAPH rather than one job, and
      # this leg is inside it -- the argument was always about which context
      # gates the merge, not about which runner executes the step.)
      #
      # `tests/agent-tooling/emitted-project-wiring.test.ts`, which runs in the `unit`
      # project above, fails if this step stops naming --project=emitted, if the
      # project's include glob stops matching any file, or if one of these tests is
      # written outside the directory the project owns.
      - name: Emitted-code guards (the scaffolder's output actually RUNS)
        run: pnpm --filter @kitn.ai/ui exec vitest run --project=emitted

      - name: React adapter tests
        run: pnpm --filter @kitn.ai/ui test:react

      # The openrouter spike's own suite, in the REQUIRED job.
      #
      # `.github/workflows/test.yml` used to run only packages/ui, so nothing
      # here ran anywhere automatic. That stopped being tolerable when
      # `src/cards.seam.test.ts` landed, because its ENTIRE PURPOSE is to fail
      # when nobody is looking: it guards the consumer `cardTypes` seam, whose
      # previous coverage vanished silently when the workaround that incidentally
      # provided it was correctly deleted. A guard against silent disappearance
      # that itself runs nowhere automatic has exactly the shape of the bug it
      # guards against.
      #
      # REQUIRED rather than advisory, and the cost is why that is an easy call:
      # node environment, no DOM, no browser, no key, no network, 84 tests in
      # 1.3s and a 2.3s typecheck. The browser-level conformance harness -- the
      # part that is slow and has a known flake -- is advisory in its own
      # workflow (spike-conformance.yml). The deterministic half gates merges;
      # the flaky half does not. Needs the build above: the spike reads the kit's
      # own built `@kitn.ai/ui/schemas` entry rather than restating its list of
      # built-in card types. ~4s total.
      - name: Spike typecheck (openrouter conformance harness)
        run: pnpm --filter @kitn.ai/ui-example-openrouter-spike typecheck

      - name: Spike tests (incl. the consumer cardTypes seam guard)
        run: pnpm --filter @kitn.ai/ui-example-openrouter-spike test

      # create-kai's own suite. The build must run first and is not optional:
      # the tests read `dist/templates`, and without it they fail loudly with
      # "run build first" rather than passing on an empty template set. That
      # build also fails when any devDependency range disagrees with
      # packages/ui, which is not pedantry -- a `@types/node` range copied from
      # a starter once downgraded the HOISTED @types/node 26 -> 22 across the
      # whole workspace under node-linker=hoisted, and timed out an unrelated
      # project. ~6s total.
      - name: create-kai build (bundles templates + the shared catalogs)
        run: pnpm --filter create-kai run build

      - name: create-kai typecheck
        run: pnpm --filter create-kai run typecheck

      - name: create-kai tests (incl. the published-kit contract gate)
        run: pnpm --filter create-kai exec vitest run

      # What the TARBALL looks like, which nothing above can see. The suite runs
      # against `dist/` in the working tree; npm ships a packed subset of it, and
      # the two ways they differ are both silent. npm strips any file named
      # `.gitignore`, so a template carrying one would emit projects that ignore
      # nothing and eventually commit `.env.local`; and `files: ["dist"]` has to
      # actually carry the templates, or `npx create-kai` installs cleanly and
      # then finds no template on the user's first run. This packs and reads it.
      # It is also the second half of the `prepublishOnly` hook, so running it
      # here is what stops a publish being the first time it is ever exercised.
      - name: create-kai packed-tarball shape
        run: pnpm --filter create-kai run verify:pack

      # AND AGAIN UNDER THE NPM THAT ACTUALLY PUBLISHES, which is not this one.
      #
      # The step above runs node 22's bundled npm (10.9.8). release-please.yml
      # installs npm@12.0.2 for OIDC trusted publishing, and `verify:pack` is the
      # second half of create-kai's `prepublishOnly` hook -- so npm 12 is the npm
      # it has to work under, and until this step existed it was the one npm it
      # was never run under. That skew cost a release: npm 12 moved the top level
      # of `npm pack --json` from an array to an object keyed by package name,
      # and the run that published @kitn.ai/ui@0.24.0 then died in create-kai's
      # hook with `TypeError: Cannot read properties of undefined (reading
      # 'files')`, leaving the broken create-kai@0.1.0 on the registry with its
      # own fix unpublishable. Every check was green; none of them ran npm 12.
      #
      # The parser is version-independent on its own merits and graded against
      # committed captures of both shapes (packages/create-kai/test/pack-listing.test.ts),
      # so this step is the end-to-end half rather than the whole guard.
      #
      # Installed into RUNNER_TEMP and reached BY PATH, deliberately not
      # `npm install -g`: every step after this one keeps the npm the rest of CI
      # is tested on. The version below is asserted to equal the release job's
      # pin by packages/create-kai/test/publish-shape.test.ts, so the two cannot
      # drift apart silently -- which is the only way this step goes back to
      # testing an npm nothing publishes with.
      #
      # BOTH packages, in ONE step. packages/ui had the identical defect in its
      # own verify:pack (it sliced from the first literal `[`, which under the
      # keyed shape lands inside the `files` array and throws a SyntaxError), and
      # it was never exercised under npm 12 either. Same install, same PATH, so
      # the pin stays a single literal that publish-shape.test.ts can compare.
      - name: packed-tarball shape, both packages (under the npm the release job pins)
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-release-pin" npm@12.0.2 --no-audit --no-fund
          VERIFY_PACK_NPM="$RUNNER_TEMP/npm-release-pin/node_modules/.bin/npm" pnpm --filter create-kai run verify:pack
          VERIFY_PACK_NPM="$RUNNER_TEMP/npm-release-pin/node_modules/.bin/npm" pnpm --filter @kitn.ai/ui run verify:pack

  # Everything that reads dist/ and is not slow enough to deserve its own leg.
  #
  # `verify:generated` goes HERE specifically because this leg uploads nothing.
  # It seeds each artifact with a single-use random sentinel and restores it
  # afterwards; a leg that both seeds sentinels and produces an artifact is one
  # crashed process away from shipping a poisoned one.
  dist-guards:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the kit build
        uses: actions/download-artifact@v4
        with:
          name: kit-dist
          path: packages/ui

      # Restores the mtime ordering the artifact hop destroys -- see the comment
      # on this step in the `construct` leg.
      - name: Restore the build's mtimes (upload-artifact does not preserve them)
        run: find packages/ui/dist -exec touch {} +

      # Re-runs the generators and fails if any checked-in derived artifact
      # differs -- element-meta.json, element-types.d.ts, icon-names.json, the
      # React wrappers, llms.txt / llms-full.txt and docs/web-components.md.
      # fc40a10 registered a new ::part(citations) and regenerated none of them;
      # nothing went red, and because the `kai` MCP's component_reference and the
      # docs site's PartTable.astro read those files, a part that existed in the
      # SHIPPED element was invisible to every tool a developer would use to find
      # it. A human noticing does not scale.
      #
      # This deliberately does NOT lean on the build step above. `nx build ui`
      # runs the generators via postbuild, but their side effects land in the
      # SOURCE tree and the NX cache does not restore those, so on a cache HIT
      # the target prints "Successfully ran target build" and leaves the tree
      # stale -- a cached build is indistinguishable from a successful one. This
      # step invokes build:api directly and never goes through NX, so no cache
      # state can affect its result.
      #
      # It also cannot pass vacuously: each artifact is seeded with a single-use
      # random sentinel before the run and must come back without it, so a
      # generator that was deleted, renamed, dropped an output or no-op'd fails
      # here instead of reading as "in sync". The guard restores every file it
      # touches, pass or fail. No build needed, no network. ~20s.
      - name: Generated artifacts in sync with their source
        run: pnpm --filter @kitn.ai/ui run verify:generated

      - name: Typecheck
        run: pnpm exec nx typecheck ui

      # Compiles the `kai` MCP scaffolder's EMITTED code with real `tsc --strict
      # --noUnusedLocals`, resolving @kitn.ai/ui through the shipped exports map
      # and .d.ts. Emitted code lives in string literals, so scaffold.test.ts can
      # assert its wording but never its types; this caught an unused import that
      # failed `npm run build` in a stock create-vite app.
      #
      # Two matrices. The FRONT END axis is SURFACE x integration x framework --
      # a surface is a components LIST from `listSurfaceProbes()` (none, each
      # capability alone, and all of them), NOT an archetype id. That swap is the
      # substance, not the cell count. The presets are still there as data, and
      # they are the wrong axis for two structural reasons that do not depend on
      # any count: they collide (two carry identical components and differ only
      # in `defaultPlacement`, which this matrix pins, so one cell re-compiled
      # the previous cell's types), and each one is exactly ONE capability -- so
      # the maximal chat+sources+tool+reasoning+artifact+voice+attachments cell,
      # which NO preset can express and which the feature multi-select makes
      # reachable, had nothing compiling it at all. Read the `WHY NOT THE POWER
      # SET` comment in archetypes.ts before touching the axis.
      #
      # The second matrix is the BACKEND ROUTE (integration x host framework),
      # added when the routes stopped being sliced off and discarded, under three
      # more tsc projects that model the real host -- node/no-DOM for express +
      # Vite middleware, DOM for Next/SvelteKit/TanStack, workers-types for
      # Cloudflare. That split is the point: the first run found TS2339 on
      # `await request.json()` in all seven TS integrations, green on a Next
      # tsconfig and a hard `npm run build` failure on a Vite app's.
      #
      # NO CELL COUNT IS PINNED HERE ON PURPOSE. Every axis is derived from the
      # registry at run time, so registering an integration moves the counts by
      # itself -- writing a number here would restore the coupling the derivation
      # removed (`openai` and `anthropic` both landed in the catalog and compiled
      # ZERO times while this script printed success at a hardcoded count). The
      # script PRINTS what it actually ran; read that. Today it prints 616 front
      # ends (7 surfaces x 11 integrations x 8 TS frameworks) and 121 routes of
      # which 99 reach tsc -- 11 are python, and `mock`'s 11 stream in the
      # browser and emit no route at all. ~16s, still no network.
      - name: Scaffolder output compiles (tsc --strict over emitted code)
        run: pnpm --filter @kitn.ai/ui run verify:scaffold

      # Packs the built package, installs it into a throwaway app OUTSIDE the
      # repo, and bundles it with Vite 8 (Rolldown -- what `npm create vite`
      # gives consumers today, and the strictest `sideEffects` consumer we know
      # of). Asserts every kai-* registration survives. The in-build guard only
      # proves OUR bundle keeps the reference; this proves a CONSUMER's bundler
      # keeps the side effects, which is how 0.19.0 shipped a blank page.
      - name: Consumer packaging guard (registrations survive a real bundler)
        run: pnpm --filter @kitn.ai/ui run verify:consumer

      # Packs the build, installs it into a throwaway app, and type-checks our
      # SHIPPED .d.ts with a real tsc under BOTH `bundler` and `nodenext`, in both
      # directions: a wrong assignment per public entry MUST error, and correct
      # usage MUST compile. Both halves are required -- "wrong code errors" alone
      # is satisfied by types that error at everything, and "right code compiles"
      # alone is satisfied by types that are entirely `any`, which is the actual
      # bug this catches. 0.19.0 shipped declarations re-exporting './read',
      # './encode' with no file extension: `bundler` tolerates it, node16/nodenext
      # rejects it, and `skipLibCheck: true` -- on in every Vite template --
      # SUPPRESSES the rejection and silently types the whole public API as `any`.
      # No error, no warning, no type-checking at all for the consumer. The kit's
      # own typecheck compiles src/ under its own tsconfig and cannot see it; the
      # in-build verify:dts reasons about dist/ with our model of resolution. This
      # asks the only authority that counts. Needs the build above + network. ~8s
      # locally; the npm install dominates on CI.
      - name: Consumer types guard (shipped .d.ts type-check under bundler + nodenext)
        run: pnpm --filter @kitn.ai/ui run verify:dts:consumer

      # TWO guards, chained; `verify:ssr` runs both and fails on either.
      #
      # verify-ssr-imports.mjs imports EVERY public entry in the exports map
      # under Node's `node` condition, one child process each. Nothing in the
      # repo ever imported the BUILT package on a server, so `import
      # '@kitn.ai/ui'` threw "Client-only API called on the server side" in every
      # published version through 0.20.0 -- a hard SSR/prerender/RSC failure for
      # any consumer touching a value export.
      #
      # verify-ssr-render.mjs then RENDERS every component the server entries
      # export, through Solid's renderToString in a DOM-free child process,
      # because importable is not the same as renderable. Watched failing, not
      # assumed: planting `document.documentElement.dataset.theme` at
      # component-BODY scope in `Skeleton` left the import guard at 9/9 green and
      # exit 0 while a real server render of the same build threw "document is
      # not defined". The render guard turns that red naming the global, the
      # component and the entry. It also self-tests on every run -- it renders a
      # canary that MUST be caught and one that MUST produce markup -- so a
      # harness that quietly stopped measuring goes red instead of green.
      # Needs the build above. ~5s, no network.
      - name: Server guard (every entry imports AND every component renders under `node`)
        run: pnpm --filter @kitn.ai/ui run verify:ssr

      # Diffs the registered-element catalog (src/elements/element-meta.json)
      # against the public SolidJS surface, derived from the TS checker and
      # cross-checked against the BUILT entry's runtime keys. The catalog size is
      # not restated here -- the script prints `elements <n>` and the n/n verdict
      # on every run, and that line is the source of the number.
      #
      # Solid is the authored layer, and the framework docs promise the same
      # catalog everywhere -- but src/index.ts was grown by hand and nobody ever
      # diffed it against the registry, so when this guard was introduced 33 of
      # the then-79 elements had no writable Solid equivalent (kai-chat,
      # kai-thread and kai-workspace among them). Those gaps are closed: it
      # reports GAP 0 today. Also asserts every public component ships a
      # <Name>Props type. Needs the build above; a missing build fails the check
      # rather than skipping it.
      - name: Solid coverage guard (every element writable in SolidJS)
        run: pnpm --filter @kitn.ai/ui run verify:solid-coverage

      # Packs the tarball and weighs what a consumer actually downloads. `files`
      # ships the whole of `src/` on purpose -- consumers read source, and source
      # maps point into it -- and that blanket include is how 300 KB of generated
      # JSON (src/components/component-meta.json) rode along to every consumer for
      # months: nothing imported it, the `exports` map could not even reach it, and
      # no check looked at what gets PACKED rather than at what gets built.
      #
      # Two rules, deliberately different in kind. PRECISE: every packed file
      # outside dist/ over 64 KiB must be allowlisted with a written reason, so a
      # new large artifact under src/ becomes a reviewable act instead of an
      # accident, and the failure names the offender. CRUDE: total unpacked size
      # under a ceiling -- it names nothing, but it is the only backstop for the
      # growth rule 1 cannot see, namely many small files or bloat INSIDE dist/,
      # whose content-hashed chunk names would make an exact allowlist go red on
      # every rebuild and get bumped reflexively.
      #
      # Must come after the build, and hard-fails without dist/ rather than
      # skipping: absent dist/ the tarball is a fraction of its real size and BOTH
      # rules would pass vacuously. Currently 818 files / 10.84 MiB against a
      # 12.5 MiB ceiling. ~1.4s, no network.
      - name: Pack weight guard (no dead weight ships to consumers)
        run: pnpm --filter @kitn.ai/ui run verify:pack

      # Walks every emitted .d.ts under dist/ and asserts each relative specifier
      # resolves to actual DECLARATIONS under BOTH `bundler` and `nodenext`,
      # delegated to tsc's own resolver -- a guard that re-implements module
      # resolution is a guard that disagrees with tsc.
      #
      # It already ran via `postbuild`, so why a step of its own -- and the honest
      # answer is narrower than "the cache would skip it". The build target is
      # cached (`cache: true`, outputs dist/ + storybook-static), and on a cache
      # HIT nx restores dist/ without running the npm lifecycle, so postbuild does
      # not run and this would not run with it. But this guard reads ONLY dist/,
      # so a restored dist/ is byte-identical to one this already passed against
      # when the entry was written: skipping it there is redundant, not unsound.
      # And on CI the question is moot today -- no nx cache is persisted between
      # runs at all (`cache: pnpm` caches the pnpm store, not .nx/cache), so the
      # build always runs cold and the lifecycle always fires.
      #
      # What a standalone step buys is therefore legibility and independence, not
      # a caught bug. Legibility: a failure lands on a step named for the guard
      # instead of ~430 lines into build output, where the build's own exit code
      # is the only signal. Independence: it stops being contingent on the
      # caching MODEL staying sound -- an `outputs` list that goes stale (a new
      # emitted directory not declared there) restores a PARTIAL dist/ that
      # nothing re-checks, and the lifecycle never runs to notice.
      #
      # Watched failing rather than assumed to fail: pointing a specifier in
      # dist/wire/index.d.ts at a file that does not exist turns this red naming
      # the file and the specifier (TS2307). Needs the build above. ~0.5s, no
      # network.
      - name: Declaration boundary guard (every emitted .d.ts specifier resolves)
        run: pnpm --filter @kitn.ai/ui run verify:dts

      # Does the diagnostic stream actually REACH a subscriber in the built
      # package? `./diagnostics` shipped completely inert and every gate stayed
      # green over it: verify:ssr proved the subpath imports, verify:dts:consumer
      # proved its types resolve, and the unit suite proved the SOURCE module
      # works. None of them executes a subscription against dist/, which is where
      # the defect lived -- two bundles each inlining their own copy of the
      # emitter, one of them dead-code-eliminated down to a no-op because nothing
      # in it ever called emit. This runs a real read through `./wire` and asserts
      # the events arrive at a `./diagnostics` subscriber, then does the same
      # across two instances of one module (the duplication a consumer causes by
      # bundling the kit AND loading the CDN bundle) and checks the stream-id
      # counter did not restart. Needs the build above. ~1s, no network.
      - name: Diagnostics wiring guard (events cross the ./wire ↔ ./diagnostics boundary)
        run: pnpm --filter @kitn.ai/ui run verify:diagnostics-wiring

      # Resolves the card JSON Schemas the way a consumer would, from a temp
      # package OUTSIDE the repo with the built package symlinked in. 11 schemas
      # had been copied into dist/schemas/ on every build and shipped in every
      # tarball since the card contract landed, reachable by NOBODY: "exports" is
      # a closed map and had no ./schemas key, so every specifier resolved to
      # ERR_PACKAGE_PATH_NOT_EXPORTED / TS2307. This repo's own reference harness
      # gave up and hand-derived the confirm schema in the openrouter spike,
      # saying so in a comment.
      #
      # Existence was never the question, so this never stats dist/schemas/ -- the
      # files were already there and already unreachable. It RESOLVES both public
      # surfaces (the JS entry @kitn.ai/ui/schemas, and the raw
      # @kitn.ai/ui/schemas/*.schema.json) through tsc under `bundler` AND
      # `nodenext` with the containing file's implied format, and independently
      # through Node's own exports-map implementation. It then compares BYTES:
      # every schema the entry exports, and every raw file a specifier lands on,
      # must equal the authored file in src/primitives/card-schemas/, so a stale
      # copy fails instead of reading as reachable.
      #
      # The expected set is readdirSync of that source directory, never a literal
      # count, so a 12th schema is covered the day it is added rather than the day
      # someone remembers. Needs the build above. <1s, no network.
      - name: Card-schema export guard (both surfaces reachable from outside)
        run: pnpm --filter @kitn.ai/ui run verify:schemas

      # Projects every card schema into a provider tool definition, out of the
      # BUILT dist/schemas.js, and asks whether the result is something the
      # provider would actually accept. `cardTools()` is what hands a model its
      # tool list, so a projection emitting a keyword the provider's strict mode
      # cannot compile surfaces as a 400 from a live API call in production, with
      # nothing local to look at. Unit tests check the projection's BEHAVIOUR;
      # this checks the shipped artifact.
      #
      # The blind spot it is built not to have is this repo's recurring one: a
      # single table with a provider flag, passing forever while covering one wire.
      # So the two documented strict subsets are two separate documents, asserted
      # to DIFFER, and `minItems` is checked by VALUE rather than by presence --
      # legal at any value on OpenAI, legal only at 0 or 1 on Anthropic. That is
      # the rule that silently becomes wrong the day the tables collapse into one,
      # and it 400s at request time rather than here. Every keyword occurring in
      # any authored schema must also be CLASSIFIED by BOTH tables, so a keyword
      # neither provider documents fails instead of passing unnoticed.
      #
      # It cannot pass vacuously either. Every built-in card is rejected under
      # strict on both providers today, so the emit path would never run at all;
      # two schemas of the guard's own cover it -- one inside both subsets that
      # MUST emit and be marked `strict: true` on the wire, one with a single
      # out-of-subset keyword added that MUST throw naming that keyword. That pair
      # is what separates a refusal from a projection that quietly DROPS the
      # constraint, which loosens the contract with no local signal: a `maxItems`
      # deleted on the way out means the model fills a card with more than it was
      # designed to render and nothing anywhere says so. The schema walker is
      # written independently of the one in src/, because a guard that reuses the
      # code it checks proves only that the code agrees with itself. Needs the
      # build above. <1s, no network.
      - name: Tool-definition guard (card schemas project to definitions a provider accepts)
        run: pnpm --filter @kitn.ai/ui run verify:tool-schemas

      # Compiles every fenced code block in apps/docs against the SHIPPED API --
      # the built dist/*.d.ts and element-meta.json, read at run time, nothing
      # baked in -- and checks kai-* markup, events, ::part() names and prose
      # symbols against the same source. Docs are the one consumer surface with
      # no compiler behind it, so a renamed prop or a symbol that moved entries
      # stays wrong on the site indefinitely.
      #
      # BLOCKING, and it earned that: an adversarial pass planted 12 defects --
      # camelCased attributes, a real kit prop on the wrong element, a typo'd
      # component prop, a wrong property on a kit type inside an UNTYPED js
      # fence, four real symbols imported from the wrong entry point, a
      # misspelled event, a bad ::part(), an array set as an attribute -- and it
      # caught 12/12, on the right lines, while reporting nothing at all on a
      # page of legitimate reader-owned code (undeclared helpers, omitted
      # imports, uninstalled third-party packages, a marked counter-example) or
      # on a control page of correct usage.
      #
      # It gates on `high` only; medium/advisory are reported and do not fail.
      # Its own anti-theatre self-test runs first and hard-fails the whole run if
      # a probe that must be RED goes green, so "0 findings" cannot mean "the kit
      # types resolved to `any`". Needs the build above. ~8s, no network.
      - name: Docs alignment (every doc snippet compiles against the shipped API)
        run: pnpm --filter @kitn.ai/docs run verify:docs

      # Cache the npm side of the starters. Six of the eight are pnpm workspace
      # members already installed by the step above; the other two (nextjs,
      # tanstack-start) are deliberately STANDALONE `file:` consumers, so they
      # carry package-lock.json and get their own `npm ci`. setup-node above is
      # already spending its one cache slot on pnpm, hence a separate cache here
      # rather than a second setup-node.
      - name: Cache npm (standalone starters)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: starters-npm-${{ hashFiles('examples/starters/*/package-lock.json') }}
          restore-keys: starters-npm-

      # Builds TWO corpora with the command a user actually runs, and typechecks
      # the ones whose build does not reach tsc on its own (tanstack-start:
      # `vite build` alone never does):
      #   examples/starters/  one minimal starter per framework -- the templates
      #                       `create-kai` scaffolds from.
      #   examples/apps/      the iteration ladder's whole applications, built
      #                       with the kit rather than templating it.
      #
      # Until this step nothing in CI touched the starters at all -- they were
      # covered by code review only, which is how a five-starter refactor landed
      # with nothing behind it. A starter that stops compiling ships into every
      # new scaffolded project, and the person who finds out is a new user; a
      # ladder app that stops compiling is a rung that no longer runs.
      #
      # The roster is DERIVED from those directories and each package's own
      # dependency on the kit -- `workspace:*` (linked, no install needed) vs
      # `file:` (needs npm ci) -- cross-checked against pnpm-workspace.yaml.
      # There is no hand-written list and no count typed anywhere; the run PRINTS
      # what it covered, per corpus, so read that rather than a figure here. An
      # unclassifiable package is a hard failure rather than a silent skip, and so
      # is a corpus that is missing or empty, so nothing can fall outside the
      # guard while the summary keeps claiming full coverage. The script also
      # REFUSES its own --only/--linked-only scoping flags when $CI is set, so
      # nobody can trim coverage here to save a minute.
      #
      # Budget ~1.5 min, and treat that as a CEILING rather than a baseline: one
      # full cold run measured 1m28s wall (~33s for the linked builds, ~56s for
      # the two standalone including npm ci), on a box at load average 17.6 with a
      # warm ~/.npm cache and before the apps corpus existed -- each linked app
      # adds a build apiece. Needs the build above -- everything here resolves
      # @kitn.ai/ui to the compiled dist/. This is the COMPILE floor: it cannot
      # see runtime contract failures (wrong tag, array set as an attribute),
      # which is what verify:consumer and /consumer-regression are for.
      - name: Starters + ladder apps build (roster derived by verify-starters)
        run: pnpm --filter @kitn.ai/ui run verify:starters

  # One Playwright install, then everything that needs a browser.
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the kit build
        uses: actions/download-artifact@v4
        with:
          name: kit-dist
          path: packages/ui

      # Restores the mtime ordering the artifact hop destroys -- see the comment
      # on this step in the `construct` leg.
      - name: Restore the build's mtimes (upload-artifact does not preserve them)
        run: find packages/ui/dist -exec touch {} +

      # Capped because this step has been observed stalling until the job's own
      # timeout — three times — with nothing after it ever running. A
      # download+apt step that has not finished in five minutes is hung, not slow,
      # so fail here rather than burning the whole job budget on it.
      - name: Install Playwright browser
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      # Small, focused, retried-internally cross-origin postMessage SECURITY
      # matrix (remote-element.spec.ts) -- proves the host<>provider handshake
      # across two real origins, which jsdom and same-origin storybook can't.
      - name: Cross-origin e2e matrix
        run: pnpm --filter @kitn.ai/ui test:e2e

      # Every block in packages/ui/blocks/ gets its CI cell (V-2, blocks-and-
      # parts 2026-08-31): the list is DERIVED from the directory scan each
      # run, and per block it asserts (a) the manifest validates and the kai-
      # contract checks pass, (b) the generated forms under dist/blocks/ are
      # fresh against the block sources (gen-blocks --check), (c) the emitted
      # CDN form's @kitn.ai/ui pins equal package.json (dist/ is outside
      # lint:cdn-pins' scan on purpose, so the artifact a consumer pastes is
      # re-asserted here), and (d) the block's declared states run in a real
      # Chromium against its COMMITTED baseline, light + dark, zero console
      # errors -- a discovered block with no baseline is a hard failure, not
      # a skip. Build-dependent like verify:consumer AND browser-dependent,
      # which is why it sits after the Playwright install rather than beside
      # verify:consumer above. --self-test plants one failure per check class
      # (including a doctored baseline through a real driver leg) before the
      # real run. The run prints the block and check counts; read those,
      # never a figure copied here. Roughly half a minute per block plus a
      # one-leg self-test, measured at the gate's own OK lines.
      - name: Block cells (every block vs its committed baseline, built bundle)
        run: pnpm --filter @kitn.ai/ui run verify:blocks

      # Does a keyboard focus indicator actually PAINT inside a kai-* shadow
      # root? Asserting classes proves nothing here: `@property` registration is
      # document-global and ignored inside a shadow root, so every `--tw-*` is
      # unset, the box-shadow shorthand behind `ring-*` is invalid at
      # computed-value time and drops, and a control keeps a perfectly correct
      # `focus-visible:ring-2` class while painting nothing. 29 of 39 focusable
      # controls had NO focus indicator at all in a real consumer app.
      #
      # This runs against the BUILT bundle (needs the build above) in a bare
      # harness with NO document-level Tailwind, because that is what a consumer
      # app looks like. Storybook and the docs site both load Tailwind at
      # document level, which registers the properties globally and makes every
      # shadow-root ring paint -- which is exactly why this shipped unnoticed.
      # The spec asserts that absence before it measures anything, so a harness
      # that drifted back into Storybook's condition fails instead of going
      # green over a broken kit. It also carries a negative and a positive
      # control in the same run, bracketing the pixel differ from both sides.
      # ~1min, no network.
      - name: Focus-indicator paint guard (shadow-root rings, built bundle)
        run: pnpm --filter @kitn.ai/ui run test:focus-ring

      # A branded --kai-color-primary must color CONTROLS, never message
      # CONTENT ("accent brands controls, never content" — owner-ruled). The
      # user-message bubble used to set text-primary on the text part, so any
      # consumer that branded primary got brand-colored message text on every
      # thread surface. Same shape as the two guards above: bare harness, no
      # document Tailwind, drives the BUILT bundle, because only the real
      # cascade proves what a branded custom property resolves to inside a
      # shadow root. Carries a positive control (a default kai-button DOES take
      # the brand) so the negative assertion can't pass by nothing being wired.
      - name: Message text-token guard (brand must not color content, built bundle)
        run: pnpm --filter @kitn.ai/ui run test:message-text-token

      # Same class of defect, found a third time (a live owner demo branded
      # purple): reasoning.tsx's "Thinking" label, loader.tsx's terminal caret
      # and loading-dots text, prompt-suggestion.tsx's matched-highlight, and
      # file-tree.tsx's folder icon all hardcoded text-primary (BRAND) on
      # content/chrome. Same bare, Tailwind-free, built-bundle harness; same
      # positive-control shape.
      - name: Content brand-bleed guard (accent must not color content/chrome, built bundle)
        run: pnpm --filter @kitn.ai/ui run test:content-brand-bleed

      # Keyboard tab-stop behaviour for the hover-card, same shape as above:
      # Storybook-free, own port, drives the BUILT bundle. Added by PR #284;
      # this step is wired here deliberately BEFORE that branch merged, because
      # the whole point of the change above is that a guard nobody wires into CI
      # is worse than no guard -- the accessibility docs cited exactly such a
      # script as proof for months while it ran nowhere. If this step fails with
      # a missing config, PR #284 has not landed yet: that is a sequencing
      # problem to resolve by merging it, NOT by deleting this step.
      # Expects: packages/ui/playwright.hovercard.config.ts
      #          packages/ui/tests/e2e/hover-card-tabstops.spec.ts
      - name: Hover-card tab-stop guard (built bundle)
        run: pnpm --filter @kitn.ai/ui exec playwright test --config playwright.hovercard.config.ts

      # ONE Storybook for BOTH IVPs below. Their configs already set
      # `reuseExistingServer: true` (not `!CI`), so each will attach to a server
      # that is already up and boot its own only if none is -- which is what made
      # this free. Without it the command IVP boots Storybook, Playwright tears it
      # down at the end of that step, and the menu IVP boots it again.
      #
      # Both are deliberately Storybook-dependent: what they test is filtering and
      # keyboard selection, which the stories exercise directly. The paint guards
      # above run bare for the opposite reason -- Storybook's document-level
      # Tailwind registers `@property` globally and would mask the very defect
      # they exist for.
      # NO `--` BEFORE THE FLAGS. The playwright configs spell this boot
      # `npm run storybook -- --ci --quiet`, and npm eats the separator; pnpm
      # 10 forwards it verbatim, so the pnpm spelling of the same line runs
      # `storybook dev -p 6006 -- --ci --quiet` and the CLI rejects it with
      # `too many arguments for 'dev'`. The server then never binds and the poll
      # below burns its full ceiling -- which is exactly how this shipped red the
      # first time, with the reason sitting unread in a log nobody printed.
      # Hence the `cat` on failure: a boot that does not answer must say why in
      # the job output, not in a temp file the runner throws away.
      - name: Start Storybook once for both IVPs (each config reuses it)
        run: |
          nohup pnpm --filter @kitn.ai/ui run storybook --ci --quiet > "$RUNNER_TEMP/storybook.log" 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:6006/iframe.html > /dev/null; do sleep 2; done' || { echo "--- storybook.log ---"; cat "$RUNNER_TEMP/storybook.log"; exit 1; }

      # The <kai-command> palette: filtering, roving activeId, and which row
      # Enter actually selects. It had a full Playwright suite and an npm script
      # (`test:command-ivp`) that NOTHING invoked -- the same "a guard nobody
      # wires into CI is worse than no guard" hole the two steps above were
      # written to close, except this one already had the guard.
      #
      # UNLIKE the two steps above, this one DOES need Storybook: the spec drives
      # the real story same-origin on :6006, and the config boots it itself
      # (`reuseExistingServer`, 120s ceiling). That is deliberate for this
      # element rather than an oversight to fix -- what is under test is command
      # filtering and keyboard selection, which the story exercises directly,
      # not shadow-root PAINT, which is the specific thing Storybook's
      # document-level Tailwind would mask and which is why the focus-ring and
      # hover-card guards run bare. Cold (no server up, Playwright booting its
      # own) the whole step measured 17.4s locally; warm, under 5s.
      #
      - name: Command-palette IVP (kai-command, storybook)
        run: pnpm --filter @kitn.ai/ui run test:command-ivp

      # <kai-menu> and the Solid cascading-menu primitives under it: submenu
      # open-on-hover, ArrowRight/ArrowLeft traversal into and out of a sub, the
      # in-place checkbox toggle, and which id `kai-select` actually carries.
      # Same story as the step above — a full suite plus a `test:menu-ivp` script
      # that nothing invoked.
      #
      # Storybook-dependent for the same reason and with the same justification:
      # what is under test is keyboard navigation and SELECTION, which the story
      # exercises directly, not shadow-root paint, which is the one thing
      # Storybook's document-level Tailwind would mask (that is why the focus-ring
      # and hover-card guards run bare instead). ~30s cold, ~10s warm.
      #
      # It was RED when first run — 6/7, on a stale assertion rather than a
      # product defect: it expected `getByText('⌘U')`, but <kai-menu> renders
      # shortcuts through <Kbd>, which emits one `part="key"` cap per token, so no
      # single element carries that text. The repaired assertion walks the parts
      # and DERIVES the modifier glyph from the browser under test, because `Mod`
      # resolves to ⌘ on mac and `Ctrl` on this Linux runner -- hard-coding the mac
      # glyph would have been green on every developer's machine and red here.
      - name: Menu IVP (kai-menu + cascading primitives, storybook)
        run: pnpm --filter @kitn.ai/ui run test:menu-ivp

  # THE REQUIRED CHECK. It runs no gate: the five legs above do, and this fails
  # unless every one of them succeeded.
  #
  # `if: always()` is what makes a red leg RED here rather than skipped. Without
  # it a failed leg skips this job, and a skipped required check is not a failed
  # one -- the ruleset would see a green gate over a workflow that ran nothing.
  #
  # The verdict is DERIVED. `storybook-gate` below compares one named result
  # because it has exactly one leg; a five-leg copy of that shape has a real
  # failure mode, which is a leg added to `needs:` and forgotten in the `if`
  # chain, silently ungated forever. `toJSON(needs)` IS the `needs:` list, so the
  # two cannot drift, and the failure names the red legs.
  #
  # ONE LINE, not a pretty-printed jq filter: `lint-gate-parity.mjs` classifies a
  # `run:` block line by line, so a wrapped filter's continuation lines reach it
  # as commands it has never seen and the linter hard-fails on them. The whole
  # pipeline has to be one logical line for the gate-set extractor to place it.
  test:
    needs: [build, construct, unit, dist-guards, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg of the required gate must have succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | map(select(.value.result != "success")) | if length == 0 then "every leg succeeded" else (map("\(.key): \(.value.result)") | join(", ") | "red or skipped legs -- \(.)" | halt_error(1)) end'

  # The storybook browser project runs ~112 *.stories.tsx as chromium browser
  # tests (smoke render + play functions + axe a11y), split across 4 matrix jobs.
  # vitest runs each invocation through ONE long-lived chromium process, which
  # accumulates ~20MB of never-reclaimed memory per story file and crashes around
  # ~45 files locally (fewer on the smaller CI runners) with "Browser connection
  # was closed" / "[birpc] rpc is closed" — a process-level crash, not a per-test
  # failure, so vitest's own `retry` can't recover it. The real fix is capping
  # files-per-process: each job's `test:storybook:ci` wrapper splits its slice
  # into ~20-total fresh-chromium sub-shards of ~5-6 files each (and retries each
  # sub-shard to absorb a rare crash). The stable `storybook-gate` job (below)
  # aggregates all shards into one REQUIRED status context -- ruleset 18328421
  # requires `test` and `storybook-gate`. A real, repeatable regression still
  # fails every retry and shows red here.
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same cap, same reason as the `browser` job's copy of this step above.
      - name: Install Playwright browser
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Build (element bundle + provider subpath)
        run: pnpm exec nx build ui

      - name: Storybook tests (a11y + interaction) -- shard ${{ matrix.shard }}/4
        env:
          STORYBOOK_SHARD: ${{ matrix.shard }}/4
          STORYBOOK_SUBSHARD_TOTAL: '20'
        run: pnpm --filter @kitn.ai/ui test:storybook:ci

  # Stable aggregation gate: collapses the storybook browser suite's shards into
  # ONE status context. `needs: [storybook]` makes `needs.storybook.result`
  # 'success' only when EVERY matrix shard succeeded; `if: always()` ensures this
  # job still runs (and can fail) when a shard fails, instead of being skipped.
  #
  # This context is REQUIRED as of 2026-09-01 (owner-ruled). It was advisory for
  # a long time because the browser suite flaked, and leaving it advisory is how
  # three a11y defects shipped; #359 fixed them and the ruleset was raised to two
  # contexts. The aggregation is what makes that possible: the ruleset names this
  # one stable context rather than the per-shard `storybook (N)` ones, so
  # changing the shard count never breaks the required-checks config.
  #
  # It is a SIBLING of `test`, not a leg of it. `lint:gate-parity` exempts this
  # job and the `storybook` matrix by name for exactly that reason -- see
  # EXEMPT_JOBS in packages/ui/scripts/lint-gate-parity.mjs.
  #
  # Do not infer required status from this comment -- run the `gh api` query in
  # this file's header comment above, which reads the ruleset itself.
  storybook-gate:
    needs: [storybook]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all storybook shards to pass
        run: |
          if [ "${{ needs.storybook.result }}" != "success" ]; then
            echo "storybook shards did not all succeed (result: ${{ needs.storybook.result }})"
            exit 1
          fi
          echo "all storybook shards passed"
