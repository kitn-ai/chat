name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The REQUIRED check -- and, today, the ONLY one. Everything here is
  # deterministic: build, typecheck, the jsdom unit project, the React adapter
  # tests, and the cross-origin e2e security matrix. The flaky storybook BROWSER
  # project lives in its own `storybook` job below, aggregated by
  # `storybook-gate`, which is ADVISORY and does NOT block a merge -- so
  # environmental chromium crashes are retried away rather than blocking merges.
  #
  # WHICH CONTEXTS BLOCK A MERGE IS RULESET CONFIG, NOT WORKFLOW CONFIG, so this
  # comment cannot be authoritative and you should not act on it without asking
  # the API. Job names here do not imply required status; only the ruleset does:
  #
  #   gh api repos/kitn-ai/ui/rulesets/18328421 \
  #     --jq '.rules[] | select(.type == "required_status_checks")
  #           | .parameters.required_status_checks[].context'
  #
  # That prints the live list. If it prints anything other than `test` alone,
  # this comment and the `storybook-gate` one below are the stale things.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No workflow in this repository may spend money on model calls.
      #
      # The openrouter spike's conformance harness can drive REAL models through
      # OpenRouter; a measured five-configuration sweep came to $0.1019. Live
      # runs are manual and deliberate, and this is the step that keeps them
      # that way for every workflow file in the repo, not just the one below.
      #
      # It exists because the interesting failure is in the FUTURE: someone
      # copies the advisory conformance job in spike-conformance.yml, flips it
      # to live for a nightly sweep, and nothing objects. The audit's central
      # rule is deny-by-default -- any line that reaches the harness without
      # going through `spike-ci-guard.mjs exec` is a finding, so an invocation
      # route nobody predicted fails BECAUSE it is unrecognised rather than
      # passing because it is unlisted.
      #
      # It cannot pass vacuously: a self-test runs each of the 6 rules against
      # its own known-bad sample and the whole rule set against a known-good
      # one FIRST, and hard-fails the run if a rule that must fire does not, or
      # if the clean sample draws a finding. Watched failing rather than assumed
      # to: neutering one rule's pattern turns it red naming that rule.
      #
      # Deliberately before `pnpm install` -- pure node, no dependencies, no
      # build, no network. <1s.
      - name: Model-spend guard (no workflow can reach a live model)
        run: node .github/scripts/spike-ci-guard.mjs audit

      # examples/starters/tanstack-start is deliberately NOT a pnpm workspace
      # member (see pnpm-workspace.yaml): it carries `.npmrc` with
      # install-links=true so it reproduces a real npm-install consumer path,
      # which is the entire reason the starter exists. The cost of that is that
      # it has no nx `test` target and packages/ui's vitest root cannot see it,
      # so its 43-test static-file-server suite -- the one that pins the
      # path-traversal guard in serve.mjs, including the block proving the suite
      # can fail -- ran in NO CI at all. A test nobody runs is not a test.
      #
      # It goes HERE, in the required job, ahead of `pnpm install`, because it
      # needs neither an install nor a build: node's built-in runner, its own
      # synthesised fixture tree, no dependencies. ~2s, and a break fails the run
      # before 20 minutes of build have been spent. This is REQUIRED signal --
      # `test` is the context branch protection requires -- not advisory.
      #
      # node's own exit code is this step's exit code: no pipe, no `tail`, no
      # wrapper shell that could swallow it.
      - name: TanStack Start static-server guard (path traversal, no install needed)
        working-directory: examples/starters/tanstack-start
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/tanstack-traversal.tap"

      # The step above cannot be trusted on its exit code alone. MEASURED on node
      # 22.22: `node --test` in a directory it matches no files in prints
      # "# tests 0" and exits 0 -- "zero tests found" and "all 43 passed" are the
      # same outcome. So a wrong working-directory, a renamed suite, or a change
      # to node's discovery glob would turn this into a green step covering
      # nothing, which is the precise failure mode the suite was written against.
      #
      # Hence the second TAP reporter above, written to a file, and this: the run
      # must REPORT a non-zero test count. An empty run fails here, loudly,
      # naming what it saw.
      - name: Traversal guard ran a non-empty suite (0 tests must not read as green)
        run: |
          node -e '
            const fs = require("node:fs");
            const tap = process.env.RUNNER_TEMP + "/tanstack-traversal.tap";
            const m = /^# tests (\d+)$/m.exec(fs.readFileSync(tap, "utf8"));
            if (!m) {
              console.error(`no "# tests" line in ${tap}: the run above emitted no TAP plan at all`);
              process.exit(1);
            }
            if (Number(m[1]) < 1) {
              console.error(`the traversal suite reported ${m[1]} tests. It exited 0 because node --test treats "matched no files" as success -- check the working-directory and the suite filename.`);
              process.exit(1);
            }
            console.log(`traversal suite reported ${m[1]} tests`);
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CLAUDE.md's "decide loudly" corollary, enforced on the one layer where a
      # quiet decision is IRREVERSIBLE: src/wire turns ChatMessage.parts into a
      # provider request, so a variant it does not encode is gone by the time the
      # request leaves the process. #186 shipped exactly that -- a user turn
      # carrying only an attachment encoded to nothing -- and the drop was already
      # explained in a prose comment, which is why the waiver this guard accepts
      # is a parsed directive that must NAME each dropped variant rather than a
      # sentence. A waiver covers only what it spells out, so a seventh
      # MessagePart member re-fires every waived site instead of being swallowed.
      #
      # Runs BEFORE the build because it needs none: it parses source only and
      # reads no dist/, so it reports in ~1s and is a seam anyone can grab to
      # watch it fail (`node packages/ui/scripts/lint-silent-drops.mjs`).
      #
      # It cannot pass vacuously. `--self-test` asserts the analyzer still
      # DETECTS on ten known-bad and known-good inputs, and the scan itself exits
      # non-zero if the MessagePart union will not parse, if no wire source is
      # found, or if no function in it discriminates a part at all -- because each
      # of those is this script being broken, not the tree being clean.
      - name: Silent-drop guard (wire encoders)
        run: pnpm --filter @kitn.ai/ui run lint:silent-drops

      # Reintroduction guard for `url: URL.createObjectURL(file)` -- an object
      # URL staged onto an attachment's `url`, the field the wire has to encode.
      # It resolves only inside the tab that minted it, so it renders a perfect
      # thumbnail and reaches no model; #186 shipped exactly that. The encoders
      # now REFUSE it, so this guards the SOURCE rather than the symptom, and it
      # fixes the two instances that were live on ui.kitn.ai -- one of which
      # recommended the anti-pattern in a comment.
      #
      # UNLIKE the silent-drop guard directly above, a ZERO-MATCH RUN HERE IS A
      # PASS. That one scans for dispatch sites it knows exist, so finding none
      # means it is broken; this one scans for a forbidden pattern, so finding
      # none is the healthy steady state and is the state the tree is in the
      # moment it lands. Its vacuity tripwire is therefore zero FILES walked, not
      # zero findings, plus a --self-test that asserts the analyzer still detects
      # on 18 known-bad and known-good inputs.
      #
      # Detection is structural, on a real TS parse: a `url` property (or `.url`
      # member) whose value comes from createObjectURL. It deliberately does NOT
      # key on the `cond ? work() : undefined` ternary shape, which lint-silent-
      # drops records as considered and rejected for imprecision. Minting an
      # object URL to render bytes IN-TAB (components/image.tsx, voice-output.tsx)
      # binds a variable rather than a `url` property and is never matched.
      #
      # Parses source, reads no dist/, so it is a seam anyone can grab to watch it
      # fail (`node packages/ui/scripts/lint-attachment-object-urls.mjs`).
      - name: Attachment object-URL guard (docs, stories, kit)
        run: pnpm --filter @kitn.ai/ui run lint:attachment-object-urls

      - name: Build (element bundle + provider subpath)
        run: pnpm exec nx build ui

      # Re-runs the generators and fails if any checked-in derived artifact
      # differs -- element-meta.json, element-types.d.ts, icon-names.json, the
      # React wrappers, llms.txt / llms-full.txt and docs/web-components.md.
      # fc40a10 registered a new ::part(citations) and regenerated none of them;
      # nothing went red, and because the `kai` MCP's component_reference and the
      # docs site's PartTable.astro read those files, a part that existed in the
      # SHIPPED element was invisible to every tool a developer would use to find
      # it. A human noticing does not scale.
      #
      # This deliberately does NOT lean on the build step above. `nx build ui`
      # runs the generators via postbuild, but their side effects land in the
      # SOURCE tree and the NX cache does not restore those, so on a cache HIT
      # the target prints "Successfully ran target build" and leaves the tree
      # stale -- a cached build is indistinguishable from a successful one. This
      # step invokes build:api directly and never goes through NX, so no cache
      # state can affect its result.
      #
      # It also cannot pass vacuously: each artifact is seeded with a single-use
      # random sentinel before the run and must come back without it, so a
      # generator that was deleted, renamed, dropped an output or no-op'd fails
      # here instead of reading as "in sync". The guard restores every file it
      # touches, pass or fail. No build needed, no network. ~20s.
      - name: Generated artifacts in sync with their source
        run: pnpm --filter @kitn.ai/ui run verify:generated

      - name: Typecheck
        run: pnpm exec nx typecheck ui

      # Packs the built package, installs it into a throwaway app OUTSIDE the
      # repo, and bundles it with Vite 8 (Rolldown -- what `npm create vite`
      # gives consumers today, and the strictest `sideEffects` consumer we know
      # of). Asserts every kai-* registration survives. The in-build guard only
      # proves OUR bundle keeps the reference; this proves a CONSUMER's bundler
      # keeps the side effects, which is how 0.19.0 shipped a blank page.
      - name: Consumer packaging guard (registrations survive a real bundler)
        run: pnpm --filter @kitn.ai/ui run verify:consumer

      # Packs the tarball and weighs what a consumer actually downloads. `files`
      # ships the whole of `src/` on purpose -- consumers read source, and source
      # maps point into it -- and that blanket include is how 300 KB of generated
      # JSON (src/components/component-meta.json) rode along to every consumer for
      # months: nothing imported it, the `exports` map could not even reach it, and
      # no check looked at what gets PACKED rather than at what gets built.
      #
      # Two rules, deliberately different in kind. PRECISE: every packed file
      # outside dist/ over 64 KiB must be allowlisted with a written reason, so a
      # new large artifact under src/ becomes a reviewable act instead of an
      # accident, and the failure names the offender. CRUDE: total unpacked size
      # under a ceiling -- it names nothing, but it is the only backstop for the
      # growth rule 1 cannot see, namely many small files or bloat INSIDE dist/,
      # whose content-hashed chunk names would make an exact allowlist go red on
      # every rebuild and get bumped reflexively.
      #
      # Must come after the build, and hard-fails without dist/ rather than
      # skipping: absent dist/ the tarball is a fraction of its real size and BOTH
      # rules would pass vacuously. Currently 818 files / 10.84 MiB against a
      # 12.5 MiB ceiling. ~1.4s, no network.
      - name: Pack weight guard (no dead weight ships to consumers)
        run: pnpm --filter @kitn.ai/ui run verify:pack

      # Walks every emitted .d.ts under dist/ and asserts each relative specifier
      # resolves to actual DECLARATIONS under BOTH `bundler` and `nodenext`,
      # delegated to tsc's own resolver -- a guard that re-implements module
      # resolution is a guard that disagrees with tsc.
      #
      # It already ran via `postbuild`, so why a step of its own -- and the honest
      # answer is narrower than "the cache would skip it". The build target is
      # cached (`cache: true`, outputs dist/ + storybook-static), and on a cache
      # HIT nx restores dist/ without running the npm lifecycle, so postbuild does
      # not run and this would not run with it. But this guard reads ONLY dist/,
      # so a restored dist/ is byte-identical to one this already passed against
      # when the entry was written: skipping it there is redundant, not unsound.
      # And on CI the question is moot today -- no nx cache is persisted between
      # runs at all (`cache: pnpm` caches the pnpm store, not .nx/cache), so the
      # build always runs cold and the lifecycle always fires.
      #
      # What a standalone step buys is therefore legibility and independence, not
      # a caught bug. Legibility: a failure lands on a step named for the guard
      # instead of ~430 lines into build output, where the build's own exit code
      # is the only signal. Independence: it stops being contingent on the
      # caching MODEL staying sound -- an `outputs` list that goes stale (a new
      # emitted directory not declared there) restores a PARTIAL dist/ that
      # nothing re-checks, and the lifecycle never runs to notice.
      #
      # Watched failing rather than assumed to fail: pointing a specifier in
      # dist/wire/index.d.ts at a file that does not exist turns this red naming
      # the file and the specifier (TS2307). Needs the build above. ~0.5s, no
      # network.
      - name: Declaration boundary guard (every emitted .d.ts specifier resolves)
        run: pnpm --filter @kitn.ai/ui run verify:dts

      # Packs the build, installs it into a throwaway app, and type-checks our
      # SHIPPED .d.ts with a real tsc under BOTH `bundler` and `nodenext`, in both
      # directions: a wrong assignment per public entry MUST error, and correct
      # usage MUST compile. Both halves are required -- "wrong code errors" alone
      # is satisfied by types that error at everything, and "right code compiles"
      # alone is satisfied by types that are entirely `any`, which is the actual
      # bug this catches. 0.19.0 shipped declarations re-exporting './read',
      # './encode' with no file extension: `bundler` tolerates it, node16/nodenext
      # rejects it, and `skipLibCheck: true` -- on in every Vite template --
      # SUPPRESSES the rejection and silently types the whole public API as `any`.
      # No error, no warning, no type-checking at all for the consumer. The kit's
      # own typecheck compiles src/ under its own tsconfig and cannot see it; the
      # in-build verify:dts reasons about dist/ with our model of resolution. This
      # asks the only authority that counts. Needs the build above + network. ~8s
      # locally; the npm install dominates on CI.
      - name: Consumer types guard (shipped .d.ts type-check under bundler + nodenext)
        run: pnpm --filter @kitn.ai/ui run verify:dts:consumer

      # TWO guards, chained; `verify:ssr` runs both and fails on either.
      #
      # verify-ssr-imports.mjs imports EVERY public entry in the exports map
      # under Node's `node` condition, one child process each. Nothing in the
      # repo ever imported the BUILT package on a server, so `import
      # '@kitn.ai/ui'` threw "Client-only API called on the server side" in every
      # published version through 0.20.0 -- a hard SSR/prerender/RSC failure for
      # any consumer touching a value export.
      #
      # verify-ssr-render.mjs then RENDERS every component the server entries
      # export, through Solid's renderToString in a DOM-free child process,
      # because importable is not the same as renderable. Watched failing, not
      # assumed: planting `document.documentElement.dataset.theme` at
      # component-BODY scope in `Skeleton` left the import guard at 9/9 green and
      # exit 0 while a real server render of the same build threw "document is
      # not defined". The render guard turns that red naming the global, the
      # component and the entry. It also self-tests on every run -- it renders a
      # canary that MUST be caught and one that MUST produce markup -- so a
      # harness that quietly stopped measuring goes red instead of green.
      # Needs the build above. ~5s, no network.
      - name: Server guard (every entry imports AND every component renders under `node`)
        run: pnpm --filter @kitn.ai/ui run verify:ssr

      # Resolves the card JSON Schemas the way a consumer would, from a temp
      # package OUTSIDE the repo with the built package symlinked in. 11 schemas
      # had been copied into dist/schemas/ on every build and shipped in every
      # tarball since the card contract landed, reachable by NOBODY: "exports" is
      # a closed map and had no ./schemas key, so every specifier resolved to
      # ERR_PACKAGE_PATH_NOT_EXPORTED / TS2307. This repo's own reference harness
      # gave up and hand-derived the confirm schema in the openrouter spike,
      # saying so in a comment.
      #
      # Existence was never the question, so this never stats dist/schemas/ -- the
      # files were already there and already unreachable. It RESOLVES both public
      # surfaces (the JS entry @kitn.ai/ui/schemas, and the raw
      # @kitn.ai/ui/schemas/*.schema.json) through tsc under `bundler` AND
      # `nodenext` with the containing file's implied format, and independently
      # through Node's own exports-map implementation. It then compares BYTES:
      # every schema the entry exports, and every raw file a specifier lands on,
      # must equal the authored file in src/primitives/card-schemas/, so a stale
      # copy fails instead of reading as reachable.
      #
      # The expected set is readdirSync of that source directory, never a literal
      # count, so a 12th schema is covered the day it is added rather than the day
      # someone remembers. Needs the build above. <1s, no network.
      - name: Card-schema export guard (both surfaces reachable from outside)
        run: pnpm --filter @kitn.ai/ui run verify:schemas

      # Projects every card schema into a provider tool definition, out of the
      # BUILT dist/schemas.js, and asks whether the result is something the
      # provider would actually accept. `cardTools()` is what hands a model its
      # tool list, so a projection emitting a keyword the provider's strict mode
      # cannot compile surfaces as a 400 from a live API call in production, with
      # nothing local to look at. Unit tests check the projection's BEHAVIOUR;
      # this checks the shipped artifact.
      #
      # The blind spot it is built not to have is this repo's recurring one: a
      # single table with a provider flag, passing forever while covering one wire.
      # So the two documented strict subsets are two separate documents, asserted
      # to DIFFER, and `minItems` is checked by VALUE rather than by presence --
      # legal at any value on OpenAI, legal only at 0 or 1 on Anthropic. That is
      # the rule that silently becomes wrong the day the tables collapse into one,
      # and it 400s at request time rather than here. Every keyword occurring in
      # any authored schema must also be CLASSIFIED by BOTH tables, so a keyword
      # neither provider documents fails instead of passing unnoticed.
      #
      # It cannot pass vacuously either. Every built-in card is rejected under
      # strict on both providers today, so the emit path would never run at all;
      # two schemas of the guard's own cover it -- one inside both subsets that
      # MUST emit and be marked `strict: true` on the wire, one with a single
      # out-of-subset keyword added that MUST throw naming that keyword. That pair
      # is what separates a refusal from a projection that quietly DROPS the
      # constraint, which loosens the contract with no local signal: a `maxItems`
      # deleted on the way out means the model fills a card with more than it was
      # designed to render and nothing anywhere says so. The schema walker is
      # written independently of the one in src/, because a guard that reuses the
      # code it checks proves only that the code agrees with itself. Needs the
      # build above. <1s, no network.
      - name: Tool-definition guard (card schemas project to definitions a provider accepts)
        run: pnpm --filter @kitn.ai/ui run verify:tool-schemas

      # Coverage guard over the CLIENT-side card validator. Every keyword, at every
      # keyword position, in every card schema must land in exactly one of three
      # tables: ENFORCED, STRIPPED (annotation/meta, so dropping it is lossless), or
      # NOT_ENFORCED (a real constraint this validator does not implement, named
      # with a written reason). Anything else is a hard failure naming the keyword,
      # the file and the path.
      #
      # The hazard is a keyword sitting in a schema LOOKING like it constrains the
      # model's output while constraining nothing: the kit then claims to validate
      # something it does not, and a malformed card renders anyway. A silent skip
      # list would defeat the whole point, which is why the unenforced set must be
      # written down and justified rather than inferred.
      #
      # The ENFORCED set is read out of the BODY of validateAgainstSchema, not out
      # of the JsonSchema interface, because the interface is a declaration and
      # drifts in the one direction that matters -- adding `multipleOf?: number` to
      # it without adding a check to walk() would make a list-based guard call that
      # keyword enforced while nothing enforced it.
      #
      # Same script as the `build:card-validation` generator, run with --check: it
      # writes nothing and fails on drift, so the checked-in lean projection cannot
      # silently diverge from the authored schemas. Source-level -- needs neither
      # the build nor network. ~0.3s.
      - name: Card-validation coverage guard (no keyword validates nothing)
        run: pnpm --filter @kitn.ai/ui run verify:card-validation

      # Diffs the registered-element catalog (src/elements/element-meta.json)
      # against the public SolidJS surface, derived from the TS checker and
      # cross-checked against the BUILT entry's runtime keys. The catalog size is
      # not restated here -- the script prints `elements <n>` and the n/n verdict
      # on every run, and that line is the source of the number.
      #
      # Solid is the authored layer, and the framework docs promise the same
      # catalog everywhere -- but src/index.ts was grown by hand and nobody ever
      # diffed it against the registry, so when this guard was introduced 33 of
      # the then-79 elements had no writable Solid equivalent (kai-chat,
      # kai-thread and kai-workspace among them). Those gaps are closed: it
      # reports GAP 0 today. Also asserts every public component ships a
      # <Name>Props type. Needs the build above; a missing build fails the check
      # rather than skipping it.
      - name: Solid coverage guard (every element writable in SolidJS)
        run: pnpm --filter @kitn.ai/ui run verify:solid-coverage

      # Compiles the `kai` MCP scaffolder's EMITTED code with real `tsc --strict
      # --noUnusedLocals`, resolving @kitn.ai/ui through the shipped exports map
      # and .d.ts. Emitted code lives in string literals, so scaffold.test.ts can
      # assert its wording but never its types; this caught an unused import that
      # failed `npm run build` in a stock create-vite app.
      #
      # Two matrices. The FRONT END axis is SURFACE x integration x framework --
      # a surface is a components LIST from `listSurfaceProbes()` (none, each
      # capability alone, and all of them), NOT an archetype id. That swap is the
      # substance, not the cell count. The presets are still there as data, and
      # they are the wrong axis for two structural reasons that do not depend on
      # any count: they collide (two carry identical components and differ only
      # in `defaultPlacement`, which this matrix pins, so one cell re-compiled
      # the previous cell's types), and each one is exactly ONE capability -- so
      # the maximal chat+sources+tool+reasoning+artifact+voice+attachments cell,
      # which NO preset can express and which the feature multi-select makes
      # reachable, had nothing compiling it at all. Read the `WHY NOT THE POWER
      # SET` comment in archetypes.ts before touching the axis.
      #
      # The second matrix is the BACKEND ROUTE (integration x host framework),
      # added when the routes stopped being sliced off and discarded, under three
      # more tsc projects that model the real host -- node/no-DOM for express +
      # Vite middleware, DOM for Next/SvelteKit/TanStack, workers-types for
      # Cloudflare. That split is the point: the first run found TS2339 on
      # `await request.json()` in all seven TS integrations, green on a Next
      # tsconfig and a hard `npm run build` failure on a Vite app's.
      #
      # NO CELL COUNT IS PINNED HERE ON PURPOSE. Every axis is derived from the
      # registry at run time, so registering an integration moves the counts by
      # itself -- writing a number here would restore the coupling the derivation
      # removed (`openai` and `anthropic` both landed in the catalog and compiled
      # ZERO times while this script printed success at a hardcoded count). The
      # script PRINTS what it actually ran; read that. Today it prints 616 front
      # ends (7 surfaces x 11 integrations x 8 TS frameworks) and 121 routes of
      # which 99 reach tsc -- 11 are python, and `mock`'s 11 stream in the
      # browser and emit no route at all. ~16s, still no network.
      - name: Scaffolder output compiles (tsc --strict over emitted code)
        run: pnpm --filter @kitn.ai/ui run verify:scaffold

      # Cache the npm side of the starters. Six of the eight are pnpm workspace
      # members already installed by the step above; the other two (nextjs,
      # tanstack-start) are deliberately STANDALONE `file:` consumers, so they
      # carry package-lock.json and get their own `npm ci`. setup-node above is
      # already spending its one cache slot on pnpm, hence a separate cache here
      # rather than a second setup-node.
      - name: Cache npm (standalone starters)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: starters-npm-${{ hashFiles('examples/starters/*/package-lock.json') }}
          restore-keys: starters-npm-

      # Builds all EIGHT starter apps in examples/starters/ with the command a
      # user actually runs, and typechecks the ones whose build does not (only
      # tanstack-start: `vite build` alone never reaches tsc).
      #
      # Until this step nothing in CI touched the starters at all -- they were
      # covered by code review only, which is how a five-starter refactor landed
      # with nothing behind it. They are also the templates `create-kai`
      # scaffolds from, so a starter that stops compiling ships into every new
      # scaffolded project, and the person who finds out is a new user.
      #
      # The roster is DERIVED from the directory and each app's own dependency on
      # the kit -- `workspace:*` (linked, no install needed) vs `file:` (needs
      # npm ci) -- cross-checked against pnpm-workspace.yaml. There is no
      # hand-written list, and an unclassifiable starter is a hard failure rather
      # than a silent skip, so a ninth starter cannot fall outside the guard
      # while the summary keeps claiming full coverage. The script also REFUSES
      # its own --only/--linked-only scoping flags when $CI is set, so nobody can
      # trim coverage here to save a minute.
      #
      # Budget ~1.5 min, and treat that as a CEILING rather than a baseline: one
      # full cold run measured 1m28s wall (~33s for the six linked builds, ~56s
      # for the two standalone including npm ci), but it was taken on a box at
      # load average 17.6 with a warm ~/.npm cache. Needs the build above -- every starter resolves
      # @kitn.ai/ui to the compiled dist/. This is the COMPILE floor: it cannot
      # see runtime contract failures (wrong tag, array set as an attribute),
      # which is what verify:consumer and /consumer-regression are for.
      - name: Starter apps build (all 8, the create-kai templates)
        run: pnpm --filter @kitn.ai/ui run verify:starters

      # Compiles every fenced code block in apps/docs against the SHIPPED API --
      # the built dist/*.d.ts and element-meta.json, read at run time, nothing
      # baked in -- and checks kai-* markup, events, ::part() names and prose
      # symbols against the same source. Docs are the one consumer surface with
      # no compiler behind it, so a renamed prop or a symbol that moved entries
      # stays wrong on the site indefinitely.
      #
      # BLOCKING, and it earned that: an adversarial pass planted 12 defects --
      # camelCased attributes, a real kit prop on the wrong element, a typo'd
      # component prop, a wrong property on a kit type inside an UNTYPED js
      # fence, four real symbols imported from the wrong entry point, a
      # misspelled event, a bad ::part(), an array set as an attribute -- and it
      # caught 12/12, on the right lines, while reporting nothing at all on a
      # page of legitimate reader-owned code (undeclared helpers, omitted
      # imports, uninstalled third-party packages, a marked counter-example) or
      # on a control page of correct usage.
      #
      # It gates on `high` only; medium/advisory are reported and do not fail.
      # Its own anti-theatre self-test runs first and hard-fails the whole run if
      # a probe that must be RED goes green, so "0 findings" cannot mean "the kit
      # types resolved to `any`". Needs the build above. ~8s, no network.
      - name: Docs alignment (every doc snippet compiles against the shipped API)
        run: pnpm --filter @kitn.ai/docs run verify:docs

      # Run ONLY the jsdom unit project. pnpm test (= vitest run) would also
      # spin up the storybook BROWSER project; that runs in its own job now.
      - name: Unit tests (jsdom)
        run: pnpm --filter @kitn.ai/ui exec vitest run --project=unit

      # The run-the-emitted-code guards, in the REQUIRED job on purpose.
      #
      # They write the `kai` MCP scaffolder's emitted `src/main.ts` to a real module
      # and EXECUTE it against a mounted <kai-chat> and a stubbed provider stream, so
      # they are the only layer that can tell a working emit from a plausible-looking
      # one -- scaffold.test.ts asserts the wording of string literals and
      # verify:scaffold compiles the output under eight consumer tsconfigs, and
      # neither can see whether anything reaches the screen.
      #
      # A SEPARATE STEP, NOT A SEPARATE JOB. The whole reason these moved out of the
      # `unit` project is that they cost seconds each (recorded as 9.6s idle, 32.6s
      # under CPU starvation -- BOTH INVALIDATED: the "idle" box had four cores pinned
      # by orphaned CPU burners, see `packages/ui/emitted-code-tests.ts`. The ORDER of
      # magnitude is what this argument rests on, and seconds-not-milliseconds
      # survives; the specific figures do not) and were distorting a suite whose
      # 99th-percentile test is under a second. That is an argument about which
      # project owns them, not about whether
      # they gate a merge: they must stay inside the one required context, next to the
      # build they depend on, or splitting them out would have traded a slow check for
      # no check. Needs the build above (src/elements/compiled.css). ~10s, which
      # restates the same invalidated local "idle" reading and is not a figure from
      # this runner; treat it as an order of magnitude, not a budget.
      #
      # `tests/agent-tooling/emitted-project-wiring.test.ts`, which runs in the `unit`
      # project above, fails if this step stops naming --project=emitted, if the
      # project's include glob stops matching any file, or if one of these tests is
      # written outside the directory the project owns.
      - name: Emitted-code guards (the scaffolder's output actually RUNS)
        run: pnpm --filter @kitn.ai/ui exec vitest run --project=emitted

      # The openrouter spike's own suite, in the REQUIRED job.
      #
      # `.github/workflows/test.yml` used to run only packages/ui, so nothing
      # here ran anywhere automatic. That stopped being tolerable when
      # `src/cards.seam.test.ts` landed, because its ENTIRE PURPOSE is to fail
      # when nobody is looking: it guards the consumer `cardTypes` seam, whose
      # previous coverage vanished silently when the workaround that incidentally
      # provided it was correctly deleted. A guard against silent disappearance
      # that itself runs nowhere automatic has exactly the shape of the bug it
      # guards against.
      #
      # REQUIRED rather than advisory, and the cost is why that is an easy call:
      # node environment, no DOM, no browser, no key, no network, 84 tests in
      # 1.3s and a 2.3s typecheck. The browser-level conformance harness -- the
      # part that is slow and has a known flake -- is advisory in its own
      # workflow (spike-conformance.yml). The deterministic half gates merges;
      # the flaky half does not. Needs the build above: the spike reads the kit's
      # own built `@kitn.ai/ui/schemas` entry rather than restating its list of
      # built-in card types. ~4s total.
      - name: Spike typecheck (openrouter conformance harness)
        run: pnpm --filter @kitn.ai/ui-example-openrouter-spike typecheck

      - name: Spike tests (incl. the consumer cardTypes seam guard)
        run: pnpm --filter @kitn.ai/ui-example-openrouter-spike test

      # create-kai's own suite. The build must run first and is not optional:
      # the tests read `dist/templates`, and without it they fail loudly with
      # "run build first" rather than passing on an empty template set. That
      # build also fails when any devDependency range disagrees with
      # packages/ui, which is not pedantry -- a `@types/node` range copied from
      # a starter once downgraded the HOISTED @types/node 26 -> 22 across the
      # whole workspace under node-linker=hoisted, and timed out an unrelated
      # project. ~6s total.
      - name: create-kai build (bundles templates + the shared catalogs)
        run: pnpm --filter create-kai run build

      - name: create-kai typecheck
        run: pnpm --filter create-kai run typecheck

      - name: create-kai tests (incl. the published-kit contract gate)
        run: pnpm --filter create-kai exec vitest run

      - name: React adapter tests
        run: pnpm --filter @kitn.ai/ui test:react

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Small, focused, retried-internally cross-origin postMessage SECURITY
      # matrix (remote-element.spec.ts) -- proves the host<>provider handshake
      # across two real origins, which jsdom and same-origin storybook can't.
      - name: Cross-origin e2e matrix
        run: pnpm --filter @kitn.ai/ui test:e2e

  # The storybook browser project runs ~112 *.stories.tsx as chromium browser
  # tests (smoke render + play functions + axe a11y), split across 4 matrix jobs.
  # vitest runs each invocation through ONE long-lived chromium process, which
  # accumulates ~20MB of never-reclaimed memory per story file and crashes around
  # ~45 files locally (fewer on the smaller CI runners) with "Browser connection
  # was closed" / "[birpc] rpc is closed" — a process-level crash, not a per-test
  # failure, so vitest's own `retry` can't recover it. The real fix is capping
  # files-per-process: each job's `test:storybook:ci` wrapper splits its slice
  # into ~20-total fresh-chromium sub-shards of ~5-6 files each (and retries each
  # sub-shard to absorb a rare crash). The stable `storybook-gate` job (below)
  # aggregates all shards into one advisory status context. A real, repeatable
  # regression still fails every retry and shows red here.
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build (element bundle + provider subpath)
        run: pnpm exec nx build ui

      - name: Storybook tests (a11y + interaction) -- shard ${{ matrix.shard }}/4
        env:
          STORYBOOK_SHARD: ${{ matrix.shard }}/4
          STORYBOOK_SUBSHARD_TOTAL: '20'
        run: pnpm --filter @kitn.ai/ui test:storybook:ci

  # Stable aggregation gate: collapses the storybook browser suite's shards into
  # ONE status context. `needs: [storybook]` makes `needs.storybook.result`
  # 'success' only when EVERY matrix shard succeeded; `if: always()` ensures this
  # job still runs (and can fail) when a shard fails, instead of being skipped.
  #
  # This context is ADVISORY. It is not in the branch ruleset, so a red gate here
  # does NOT block a merge -- the browser suite was tried as a required check,
  # flaked on CI, and was deliberately left advisory. The aggregation is still
  # worth having: it means that IF it is ever promoted to required, the ruleset
  # names this one stable context rather than the per-shard `storybook (N)` ones,
  # and changing the shard count never breaks the required-checks config.
  #
  # Do not infer required status from this comment -- run the `gh api` query in
  # the `test` job's header comment above, which reads the ruleset itself.
  storybook-gate:
    needs: [storybook]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all storybook shards to pass
        run: |
          if [ "${{ needs.storybook.result }}" != "success" ]; then
            echo "storybook shards did not all succeed (result: ${{ needs.storybook.result }})"
            exit 1
          fi
          echo "all storybook shards passed"
