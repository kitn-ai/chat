<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Run board — remote card provider</title>
  </head>
  <body>
    <!--
      This page is a CARD PROVIDER, not an app. It is served from :5175 and is
      only ever meaningful inside a <kai-remote> frame on another origin: the
      bridge below does nothing until a host completes the `kitn-card` handshake.
      Opened directly it shows the standalone notice and no card.
    -->
    <div id="card-root"></div>
    <p id="standalone" hidden>
      No host connected. This page is the remote half of a card and is meant to be
      framed by the ops console on <code>http://localhost:5173</code>.
    </p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
