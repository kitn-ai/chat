<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>composed support widget — CDN + accent override</title>
    <!-- Accent for a no-build page. html.mdx "Theming" says to load
         theme.tokens.css and override --color-* on :root; that was tried first
         and restyled NOTHING (the elements are self-themed in shadow DOM and
         never read --color-*). The working knob is --kai-color-* — and for
         element theming the stylesheet link below is not even needed (verified:
         removing it leaves the accent intact; theme.tokens.css themes
         host-page chrome). Kept here to mirror the docs recipe. -->
    <link rel="stylesheet" href="/kit/theme.tokens.css" />
    <style>
      :root {
        --kai-color-primary: oklch(0.55 0.22 320); /* magenta accent */
        --kai-color-primary-foreground: white;
      }
      body { margin: 0; background: #fff; }
    </style>
  </head>
  <body>
    <p style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0; color: #94a3b8; font: 14px system-ui, sans-serif; text-align: center; max-width: 28rem; padding: 0 1rem;">Accent probe: same widget, magenta --kai-color-primary override via CDN theme.tokens.css.</p>

    <kai-dock id="dock" label="Support" position="bottom-end" hide-close>
      <kai-chat
        id="chat"
        slot="panel"
        style="display: block; height: 100%;"
        chat-title="Support"
        accept="image/*,application/pdf"
        placeholder="Ask anything"
      >
        <kai-button id="close" slot="header-end" variant="ghost" size="icon-sm" icon="x" label="Close Support"></kai-button>
        <kai-empty
          slot="empty"
          empty-title="Hi, we're here to help"
          description="Ask us about orders, refunds, and more."
        ></kai-empty>
      </kai-chat>
    </kai-dock>

    <script type="module">
      import '/kit/elements/autoloader.js';
      import './app.js';
    </script>
  </body>
</html>
