<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fine-grain support widget — no kai-chat</title>
    <style>
      body { margin: 0; background: #fff; }
      @media (prefers-color-scheme: dark) { body { background: #0b1020; } }

      /* Everything below styles LIGHT DOM that fine.js owns. FINDING (F-2 in
         phase3-fine-grain.md): without <kai-chat> there is no panel chrome —
         header, view switching, home screen — so the page carries its own
         layout CSS, ~70 lines the facade version had zero of. The kit's
         elements are self-themed; this light-DOM chrome has to self-theme
         via prefers-color-scheme by hand. */
      .widget {
        display: flex; flex-direction: column; height: 100%;
        font: 14px system-ui, sans-serif; color: #0f172a; background: #fff;
        border-radius: inherit; overflow: hidden;
      }
      .widget header {
        display: flex; align-items: center; gap: 0.5rem;
        padding: 0.625rem 0.75rem; border-bottom: 1px solid #e2e8f0;
      }
      .widget header .title { font-weight: 600; flex: 1; }
      .views { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .view[hidden] { display: none; }

      /* Home view (hand-built — no kai-home element exists, F-1). */
      .home { padding: 1.25rem 1rem; gap: 0.875rem; overflow-y: auto; }
      .home h2 { margin: 0.5rem 0 0; font-size: 1.25rem; }
      .home .subtitle { margin: 0; color: #64748b; }
      .recent-card, .home-link {
        display: block; width: 100%; box-sizing: border-box; text-align: start; text-decoration: none;
        border: 1px solid #e2e8f0; border-radius: 0.625rem; padding: 0.75rem;
        background: transparent; color: inherit; font: inherit; cursor: pointer;
      }
      .recent-card:hover, .home-link:hover { border-color: #94a3b8; }
      .recent-card .row-title, .home-link .row-title { font-weight: 600; }
      .recent-card .row-sub, .home-link .row-sub { color: #64748b; font-size: 0.8125rem; margin-top: 0.125rem; }
      .recent-card[hidden] { display: none; }

      .chat-view kai-thread { flex: 1; min-height: 0; display: block; }
      .chat-view kai-prompt-input { display: block; padding: 0 0.5rem 0.5rem; }
      .list-view kai-conversations { flex: 1; min-height: 0; display: block; }

      .tabbar { padding: 0.375rem 0.5rem 0.5rem; border-top: 1px solid #e2e8f0; }
      .tabbar[hidden] { display: none; }

      @media (prefers-color-scheme: dark) {
        .widget { background: #0f172a; color: #e2e8f0; }
        .widget header, .tabbar { border-color: #1e293b; }
        .recent-card, .home-link { border-color: #1e293b; }
        .recent-card:hover, .home-link:hover { border-color: #475569; }
        .home .subtitle, .recent-card .row-sub, .home-link .row-sub { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <p style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin: 0; color: #94a3b8; font: 14px system-ui, sans-serif; text-align: center; max-width: 28rem; padding: 0 1rem;">This blank page stands in for your site. The chat widget is in the bottom-right corner. (Fine-grain composition — same widget, no &lt;kai-chat&gt;.)</p>

    <!-- The dock stays: it is launcher shell, not chat. -->
    <kai-dock id="dock" label="Support" position="bottom-end" hide-close>
      <div class="widget" slot="panel">
        <header>
          <span class="title">Support</span>
          <!-- icon names: no "list"/"send" in the curated set (F-7) — an
               unknown name paints as literal text, silently in the prod build. -->
          <kai-button id="list-toggle" variant="ghost" size="icon-sm" icon="message-circle" label="Conversations"></kai-button>
          <kai-button id="close" variant="ghost" size="icon-sm" icon="x" label="Close Support"></kai-button>
        </header>

        <div class="views">
          <!-- Home tab: hand-built (F-1 — the facade's `home` prop has no
               fine-grain element behind it). -->
          <div class="view home" id="view-home">
            <h2>How can we help? &#x1F44B;</h2>
            <p class="subtitle">Orders, refunds, anything.</p>
            <button class="recent-card" id="recent-card" hidden>
              <div class="row-title" id="recent-title"></div>
              <div class="row-sub" id="recent-sub"></div>
            </button>
            <kai-button id="cta" icon="message-square" style="align-self: start;">Send us a message</kai-button>
            <a class="home-link" href="https://ui.kitn.ai" target="_blank" rel="noreferrer">
              <div class="row-title">Help center</div>
              <div class="row-sub">Guides and FAQs</div>
            </a>
          </div>

          <!-- Messages tab: the thread + the composer, as separate elements. -->
          <div class="view chat-view" id="view-chat" hidden>
            <kai-thread id="thread">
              <kai-empty
                slot="empty"
                empty-title="Hi, we're here to help"
                description="Ask us about orders, refunds, and more."
              ></kai-empty>
            </kai-thread>
            <kai-prompt-input id="prompt" placeholder="Ask anything"></kai-prompt-input>
          </div>

          <!-- Conversations list: the real element, reached from the header. -->
          <div class="view list-view" id="view-list" hidden>
            <kai-conversations id="conversations"></kai-conversations>
          </div>
        </div>

        <div class="tabbar" id="tabbar">
          <kai-tabs id="tabs" block default-value="home"></kai-tabs>
        </div>
      </div>
    </kai-dock>

    <script type="module">
      import '/kit/elements/autoloader.js';
      import './fine.js';
    </script>
  </body>
</html>
