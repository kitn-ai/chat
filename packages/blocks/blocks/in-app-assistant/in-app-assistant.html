<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>In-app assistant</title>
    <link rel="stylesheet" href="./in-app-assistant.css" />
  </head>
  <body>
    <!-- The host app this assistant docks into. Replace with your own page;
         the aside on the right edge is the block, and it is the element
         carrying data-block-root, so a component-framework form emits the
         aside and leaves this stand-in behind. -->
    <main class="host">
      <h1>Acme Deploys</h1>
      <p class="host-note">This content stands in for your app. The assistant is docked on the right edge.</p>
      <section class="host-cards">
        <div class="host-card"><h2>payments</h2><p>Canary green for 42 minutes.</p></div>
        <div class="host-card"><h2>checkout</h2><p>Awaiting review.</p></div>
        <div class="host-card"><h2>search</h2><p>Deployed 2h ago.</p></div>
      </section>
    </main>

    <!-- The docked aside: kai-panel chrome, kai-panel-header (back/history are
         slotted content), kai-view-stack routing between the chat root and
         the drilled conversation history (drilled shows the back arrow, the
         stack's one rule, consumed not restated).

         The wiring is DECLARED here and applied by the generated binder (spec
         3.1): .prop sets a JS property, :attr a runtime scalar attribute,
         @event an action on THIS element (kai-* events do not bubble), #ref
         names a handle the controller calls methods on, *for repeats with a
         mandatory :key, and seed: writes a literal once. A binding holds a
         field name, never an expression: every derivation is a field of
         State. The ids are for the block driver's state script, which is
         authored rather than generated. -->
    <aside class="assistant" aria-label="Assistant" data-block-root>
      <kai-panel>
        <kai-panel-header slot="header">
          <kai-button
            id="back"
            slot="start"
            variant="ghost"
            size="icon-sm"
            icon="arrow-left"
            label="Back"
            hidden
            :hidden="backHidden"
            @kai-click="back"
          ></kai-button>
          Assistant
          <!-- KNOWN RESIDUAL (finding): kai-button carries no dot/badge
               affordance (kai-tab-bar-item does), so the unread signal beside
               the history button is the block's own dot span. It is a plain
               <span>, which is what makes it this block's proof that :hidden
               is not a kai-only binding. -->
          <span id="history-dot" slot="end" class="unread-dot" hidden :hidden="historyDotHidden"></span>
          <kai-button
            id="history"
            slot="end"
            variant="ghost"
            size="icon-sm"
            icon="message-square"
            label="Conversation history"
            :hidden="historyHidden"
            @kai-click="openHistory"
          ></kai-button>
        </kai-panel-header>

        <!-- The stack OWNS navigation. `view` is a SEED: the element
             self-manages it afterwards, and driving it from the same state
             kai-view-change writes is a controlled loop that undoes every
             navigation in React (spec 8b, amendment 5). -->
        <kai-view-stack id="stack" #ref="stack" seed:view="chat" @kai-view-change="viewChange">
          <!-- Chat root -->
          <kai-view name="chat" tab-root>
            <kai-thread id="thread" .messages="messages" .loading="loading">
              <kai-empty
                slot="empty"
                empty-title="What can I help with?"
                description="Ask about this page, or anything else."
              ></kai-empty>
            </kai-thread>
            <kai-prompt-input
              id="prompt"
              #ref="prompt"
              placeholder="Ask about this page"
              .suggestions="suggestions"
              .triggers="triggers"
              .loading="loading"
              @kai-submit="submit"
            ></kai-prompt-input>
          </kai-view>

          <!-- Drilled history: the conversation list in its panel
               presentation - item mode, the rows built by the *for below with
               the public density="panel", no group sections, the built-in rail
               header replaced by an empty slot. -->
          <kai-view name="history">
            <kai-conversations
              id="conversations"
              searchable="false"
              .activeId="activeId"
              @kai-conversation-select="openConversation"
            >
              <span slot="header"></span>
              <kai-conversation-item
                *for="row of conversationRows"
                :key="row.id"
                :conversation-id="row.id"
                density="panel"
                :unread="row.unread"
              >
                <span .textContent="row.title"></span>
                <span slot="meta" .textContent="row.preview" :hidden="row.previewHidden"></span>
                <span slot="menu" class="row-time" .textContent="row.time"></span>
              </kai-conversation-item>
            </kai-conversations>
            <kai-button id="new-conversation" class="new-pill" variant="outline" size="sm" @kai-click="startNew">New conversation</kai-button>
          </kai-view>
        </kai-view-stack>
      </kai-panel>
    </aside>
  </body>
</html>
